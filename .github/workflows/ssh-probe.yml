name: SSH Probe (HostGator / VPS)

on:
  workflow_dispatch:
    inputs:
      force_port:
        description: 'SSH port override (default 22)'
        required: false
        default: '22'
        type: string

concurrency:
  group: ssh-probe-aistore
  cancel-in-progress: true

jobs:
  probe:
    name: Resolve key + SSH connect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve SSH credentials
        id: creds
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_PORT_S: ${{ secrets.SSH_PORT }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
          SSH_KEY_S: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          VPS_HOST_S: ${{ secrets.VPS_HOST }}
          VPS_PORT_S: ${{ secrets.VPS_PORT }}
          VPS_USER_S: ${{ secrets.VPS_USER }}
          VPS_KEY_S: ${{ secrets.VPS_SSH_KEY }}
          CREDS_PLATAFORMA: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
          CREDS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
          FORCE_PORT: ${{ github.event.inputs.force_port }}
        run: |
          set -e
          python3 << 'PY'
          import os, json, re, pathlib, base64, subprocess

          def clean(s):
              if s is None: return ''
              return re.sub(r'[\r\n\t "\']', '', str(s)).strip()

          st = {
              'host': clean(os.environ.get('SSH_HOST_S') or os.environ.get('VPS_HOST_S')),
              'port': clean(os.environ.get('FORCE_PORT') or os.environ.get('SSH_PORT_S') or os.environ.get('VPS_PORT_S') or '22'),
              'user': clean(os.environ.get('SSH_USER_S') or os.environ.get('VPS_USER_S')),
              'key': (os.environ.get('SSH_KEY_S') or os.environ.get('VPS_KEY_S') or '').strip(),
          }

          def merge_json(raw, label):
              if not raw or not str(raw).strip():
                  print(f'  {label}: empty'); return
              text = str(raw).strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "'\"":
                  text = text[1:-1]
              try:
                  c = json.loads(text)
              except Exception as e:
                  print(f'  {label}: not JSON ({e})'); return
              if not isinstance(c, dict): return
              print(f'  {label}: keys={sorted(c.keys())}')
              st['host'] = st['host'] or clean(c.get('host') or c.get('ssh_host') or c.get('hostname') or c.get('ip'))
              st['user'] = st['user'] or clean(c.get('user') or c.get('ssh_user') or c.get('username'))
              p = c.get('ssh_port') or c.get('port')
              if p is not None and str(p).strip() and str(p).strip() not in ('21', '990', '989'):
                  st['port'] = clean(str(p))
              k = c.get('private_key') or c.get('ssh_key') or c.get('ssh_private_key') or c.get('key') or ''
              if k and not st['key']:
                  st['key'] = str(k).strip()

          merge_json(os.environ.get('CREDS_PLATAFORMA'), 'CREDENCIAIS_PLATAFORMA_BAIT')
          merge_json(os.environ.get('CREDS_HOSTGATOR'), 'CREDENCIAIS_HOSTGATOR')

          host, port, user, key = st['host'], st['port'] or '22', st['user'], st['key']
          print(f'  host={bool(host)} user={bool(user)} key_len={len(key)} port={port}')

          if not host or not user:
              print('::error::SSH_HOST/SSH_USER missing'); raise SystemExit(1)
          if not key:
              print('::error::SSH_PRIVATE_KEY missing'); raise SystemExit(1)

          def normalize_key(raw: str) -> str:
              body = raw.strip()
              if '\\n' in body:
                  body = body.replace('\\n', '\n')
              body = body.replace('\r\n', '\n').replace('\r', '\n')
              if body.count('\n') < 3 and 'BEGIN' in body and 'END' in body:
                  body = re.sub(r'-----BEGIN ([A-Z0-9 ]+)-----\s*', r'-----BEGIN \1-----\n', body)
                  body = re.sub(r'\s*-----END ([A-Z0-9 ]+)-----', r'\n-----END \1-----\n', body)
                  m = re.search(r'-----BEGIN [A-Z0-9 ]+-----\n(.+)\n-----END', body, re.S)
                  if m:
                      b64 = re.sub(r'\s+', '', m.group(1))
                      lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
                      hdr = re.search(r'-----BEGIN [A-Z0-9 ]+-----', body).group(0)
                      ftr = re.search(r'-----END [A-Z0-9 ]+-----', body).group(0)
                      body = hdr + '\n' + '\n'.join(lines) + '\n' + ftr + '\n'
              if 'BEGIN' not in body:
                  try:
                      decoded = base64.b64decode(re.sub(r'\s+', '', body))
                      if b'BEGIN' in decoded:
                          body = decoded.decode()
                  except Exception:
                      pass
              if not body.endswith('\n'):
                  body += '\n'
              return body

          body = normalize_key(key)
          kind = 'unknown'
          for label in ('OPENSSH PRIVATE KEY', 'RSA PRIVATE KEY', 'EC PRIVATE KEY', 'PRIVATE KEY'):
              if f'BEGIN {label}' in body:
                  kind = label; break
          print(f'  key_diag: kind={kind} lines={body.count(chr(10))} has_begin={"BEGIN" in body} has_end={"END" in body}')

          key_path = pathlib.Path.home() / '.ssh_key_resolved'
          key_path.write_text(body)
          key_path.chmod(0o600)

          passphrase = (os.environ.get('SSH_PASSPHRASE') or '').strip()
          # Empty passphrase first
          proc = subprocess.run(['ssh-keygen', '-y', '-f', str(key_path), '-P', passphrase],
                                capture_output=True, text=True)
          if proc.returncode != 0:
              err = (proc.stderr or '').strip().split('\n')[-1][:220]
              if 'passphrase' in err.lower() and not passphrase:
                  print('::error::Private key is encrypted — set secret SSH_KEY_PASSPHRASE, or regenerate key with: ssh-keygen -t ed25519 -N ""')
              else:
                  print(f'::error::ssh-keygen parse failed: {err}')
              raise SystemExit(1)
          print('  key_ok=true' + (' (with passphrase)' if passphrase else ' (no passphrase)'))

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HG_HOST={host}\nHG_PORT={port}\nHG_USER={user}\n')
              if passphrase:
                  f.write('HG_NEED_AGENT=1\n')
              else:
                  f.write('HG_NEED_AGENT=0\n')
          # write passphrase to file for ssh-add (never echo)
          if passphrase:
              pf = pathlib.Path.home() / '.ssh_passphrase'
              pf.write_text(passphrase)
              pf.chmod(0o600)
          PY

      - name: Start ssh-agent if key has passphrase
        if: env.HG_NEED_AGENT == '1'
        run: |
          set -e
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          # ssh-add with passphrase via SSH_ASKPASS
          printf '%s\n' '#!/bin/sh' 'cat $HOME/.ssh_passphrase' > /tmp/askpass.sh
          chmod 700 /tmp/askpass.sh
          DISPLAY= SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh_key_resolved"
          echo "ssh-agent loaded key"

      - name: SSH connect test
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KEY="$HOME/.ssh_key_resolved"
          {
            echo "Host deploy-target"
            echo "  HostName $HG_HOST"
            echo "  Port $HG_PORT"
            echo "  User $HG_USER"
            if [ "${HG_NEED_AGENT:-0}" != "1" ]; then
              echo "  IdentityFile $KEY"
              echo "  IdentitiesOnly yes"
            fi
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 15"
            echo "  BatchMode yes"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 8 -p "$HG_PORT" -H "$HG_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Connecting $HG_USER@$HG_HOST:$HG_PORT (agent=${HG_NEED_AGENT:-0})..."
          ssh deploy-target 'echo REMOTE_OK; hostname; whoami; pwd; ls -la public_html 2>/dev/null | head -5 || ls -la ~ | head -8'
          echo "### SSH probe OK" >> $GITHUB_STEP_SUMMARY
