name: AI Store CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          DATABASE_URL: "file:./db/custom.db"
          LOG_LEVEL: "error"

      - name: Check test coverage
        run: npx vitest run --coverage 2>/dev/null || true
        env:
          DATABASE_URL: "file:./db/custom.db"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Verify build artifact
        run: |
          echo "=== Build Artifact ==="
          ls -la .next/standalone/ | head -10
          echo "=== Static Assets ==="
          ls -la .next/static/ | head -10
          echo "=== Docker readiness check ==="
          test -f .next/standalone/server.js && echo "server.js OK" || exit 1
          test -d .next/standalone/.next && echo ".next dir OK" || exit 1

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-store:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker images ai-store:${{ github.sha }}
          echo "Image size:"
          docker images ai-store:${{ github.sha }} --format "{{.Size}}"
