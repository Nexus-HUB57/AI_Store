name: Deploy AI Store to HostGator

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - '.github/workflows/deploy_hostgator.yml'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'components.json'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - api-only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: aistore-hostgator-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed database
        run: |
          COUNT=$(npx tsx -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(c>0?0:1)})" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ]; then
            echo "[+] Seeding database with 1504 products..."
            npx tsx scripts/seed-full.ts
          else
            echo "[+] Database already has $COUNT products"
          fi

      - name: Build Next.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /aistore
          NEXT_PUBLIC_BASE_URL: https://www.mybait.org/aistore
        run: npx next build

      - name: Verify build
        run: |
          test -f .next/standalone/server.js && echo 'BUILD OK' || { echo 'BUILD FAILED'; exit 1; }
