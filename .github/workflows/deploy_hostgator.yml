name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'components.json'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - api-only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: aistore-hostgator-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed database (if empty)
        run: |
          COUNT=$(npx tsx -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(c>0?0:1)})" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ] || [ "$COUNT" = "0" ]; then
            echo "[+] Seeding database with 1504 products..."
            npx tsx scripts/seed-full.ts
          else
            echo "[+] Database already has $COUNT products"
          fi

      - name: Build Next.js (standalone)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /aistore
          NEXT_PUBLIC_BASE_URL: https://www.mybait.org/aistore
          BUILD_TIME: ${{ github.event.head_commit.timestamp || now() }}
        run: npx next build

      - name: Verify build output
        run: |
          echo "[+] Verifying build..."
          test -f .next/standalone/server.js || { echo "ERROR: server.js not found"; exit 1; }
          test -d .next/static || { echo "ERROR: static assets not found"; exit 1; }
          ROUTES=$(find .next/server/app -name 'route.js' 2>/dev/null | wc -l)
          SSG=$(find .next/server/app -name 'html' 2>/dev/null | wc -l)
          echo "  API routes:  $ROUTES"
          echo "  SSG pages:   $SSG"
          echo "  Static assets: $(du -sh .next/static | cut -f1)"
          echo "  Standalone:    $(du -sh .next/standalone | cut -f1)"

      - name: Prepare standalone deploy package
        run: |
          mkdir -p deploy/standalone

          # Copy standalone server output
          cp -r .next/standalone/* deploy/standalone/

          # Copy static assets into standalone/.next/static/
          mkdir -p deploy/standalone/.next/static
          cp -r .next/static/* deploy/standalone/.next/static/

          # Copy public files
          mkdir -p deploy/standalone/public
          cp -r public/* deploy/standalone/public/ 2>/dev/null || true

          # Copy Prisma schema for runtime generation
          mkdir -p deploy/standalone/prisma
          cp prisma/schema.prisma deploy/standalone/prisma/

          # Copy seeded database
          mkdir -p deploy/standalone/db
          cp db/custom.db deploy/standalone/db/custom.db
          echo "[+] DB size: $(du -sh deploy/standalone/db/custom.db | cut -f1)"

          # Copy package.json for production deps
          cp package.json deploy/standalone/

          # Copy CGI gateway files
          cp hostgator/api.cgi deploy/
          cp hostgator/.htaccess deploy/
          cp hostgator/setup_aistore.sh deploy/
          chmod +x deploy/api.cgi deploy/setup_aistore.sh

          # Create tarball
          cd deploy/standalone
          tar czf ../aistore-codebase.tar.gz .
          cd ../..

          echo "[+] Package ready: $(du -h deploy/aistore-codebase.tar.gz | cut -f1)"
          echo "    Total files: $(find deploy/standalone -type f | wc -l)"

      - name: Parse credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          eval $(python3 -c "
          import os, json
          c = json.loads(os.environ['HG_CREDS'])
          print(f\"HOST={c.get('host','')}\")
          print(f\"USER={c.get('user','')}\")
          print(f\"PASS={c.get('password','')}\")
          print(f\"PORT={c.get('port', 21)}\")
          ")
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Missing host/user/password"; exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # ═══════════════════════════════════════════════════════════
      # DEPLOY: CGI Gateway + .htaccess + Setup script
      # ═══════════════════════════════════════════════════════════
      - name: Deploy CGI gateway and routing
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 60

          mkdir -p public_html/aistore

          cd deploy
          put api.cgi -o public_html/aistore/api.cgi
          chmod 755 public_html/aistore/api.cgi

          put .htaccess -o public_html/aistore/.htaccess

          put setup_aistore.sh -o public_html/aistore/setup_aistore.sh
          chmod 755 public_html/aistore/setup_aistore.sh

          bye
          LFTP_EOF
          echo "[+] CGI gateway + .htaccess deployed"

      # ═══════════════════════════════════════════════════════════
      # DEPLOY: Codebase tarball
      # ═══════════════════════════════════════════════════════════
      - name: Upload codebase
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" <<LFTP_EOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 120

          cd deploy
          put aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz

          bye
          LFTP_EOF
          echo "[+] Codebase uploaded ($(du -h deploy/aistore-codebase.tar.gz | cut -f1))"

      # ═══════════════════════════════════════════════════════════
      # VERIFICATION
      # ═══════════════════════════════════════════════════════════
      - name: Verify deployment
        run: |
          echo "[+] Verifying..."
          sleep 3

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://www.mybait.org/aistore/" 2>/dev/null || echo "000")
          echo "  AI Store:   HTTP $STATUS"

          STATUS_H=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://www.mybait.org/aistore/api/health" 2>/dev/null || echo "000")
          echo "  Health API: HTTP $STATUS_H"

          echo ""
          echo "========================================"
          echo "  AI Store — HostGator Deploy"
          echo "========================================"
          echo "  Store:    https://www.mybait.org/aistore/"
          echo "  Health:   https://www.mybait.org/aistore/api/health"
          echo "  Version:  https://www.mybait.org/aistore/api/version"
          echo "  Products: https://www.mybait.org/aistore/api/products"
          echo "  b'AI't:   https://www.mybait.org/api/api/v1/status"
          echo "========================================"
          echo "  First visit triggers Node.js setup (~30s)"
          echo "========================================"

      - name: Deploy summary
        if: always()
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Time:   $(date -u)"
