name: Deploy AI Store to HostGator

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - '.github/workflows/deploy_hostgator.yml'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'components.json'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - api-only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: aistore-hostgator-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: echo build-would-go-here
