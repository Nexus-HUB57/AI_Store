name: FTP Diagnostic

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Debug FTP'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install paramiko
        run: pip install paramiko 2>/dev/null || true

      - name: Run diagnostic
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: python3 scripts/ftp-diag.py

      - name: Output results
        if: always()
        run: cat /tmp/diag.txt 2>/dev/null || echo 'No results file'

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-diag
          path: /tmp/diag.txt
          retention-days: 1
