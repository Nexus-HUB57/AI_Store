name: FTP Diagnostic

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Diagnostic reason'
        required: false
        default: 'Debug FTP connection'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run diagnostic
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          pip install paramiko 2>/dev/null || true
          python3 << 'PYEOF'
          import os, sys, re, json, socket, ftplib
          raw = os.environ.get('HG_CREDS', '').strip()
          
          out = []
          def log(msg=''):
              print(msg)
              out.append(msg)
          
          log('=== Credential Analysis ===')
          log(f'Secret length: {len(raw)} chars')
          log(f'Lines: {len(raw.splitlines())}')
          log(f'Starts with JSON: {raw.strip().startswith("{")}')
          log(f'First 120 chars: {repr(raw[:120])}')
          log('')
          
          if not raw:
              log('ERROR: Secret is empty')
              sys.exit(1)
          
          def clean_val(v):
              if not v: return ""
              v = re.sub(r'^(Host|Port|User|Pass|Password|Senha|Servidor|Usuario|Usuário|Porta|Login|Username):\s*', '', v, flags=re.I)
              return v.strip().strip('"').strip("'")
          
          def parse_creds(raw):
              try:
                  c = json.loads(raw)
                  return {
                      'host': clean_val(str(c.get('host', c.get('hostname', c.get('servidor', ''))))),
                      'user': clean_val(str(c.get('user', c.get('username', c.get('usuario', c.get('usuário', '')))))),
                      'pwd': clean_val(str(c.get('password', c.get('pass', c.get('senha', ''))))),
                      'port': clean_val(str(c.get('port', c.get('porta', '21'))))
                  }
              except Exception as e:
                  log(f'JSON parse failed: {e}')
          
              kv = {}
              for line in raw.splitlines():
                  line = line.strip()
                  if not line: continue
                  for sep in [': ', ':', '= ']:
                      if sep in line:
                          k, v = line.split(sep, 1)
                          kv[k.strip().lower()] = v.strip()
                          break
              
              log(f'Parsed KV pairs: {list(kv.keys())}')
              
              mapping = {
                  'host': ['host', 'hostname', 'servidor', 'ftp', 'server'],
                  'user': ['user', 'username', 'usuário', 'usuario', 'login'],
                  'pwd': ['password', 'pass', 'senha'],
                  'port': ['port', 'porta']
              }
              result = {}
              for key, aliases in mapping.items():
                  for alias in aliases:
                      if alias in kv:
                          result[key] = clean_val(kv[alias])
                          break
              
              if result.get('host') and result.get('user') and result.get('pwd'):
                  if 'port' not in result: result['port'] = '21'
                  return result
              return None
          
          creds = parse_creds(raw)
          if not creds:
              log('CREDENTIAL PARSING FAILED')
              sys.exit(1)
          
          host = creds['host']
          port = int(re.sub(r'\D', '', str(creds['port'])) or '21')
          user = creds['user']
          pwd = creds['pwd']
          log(f'Parsed: HOST={host} PORT={port} USER={user} PASS_LEN={len(pwd)}')
          
          # DNS
          log('')
          log('=== DNS Resolution ===')
          try:
              ips = socket.getaddrinfo(host, None)
              for ip in ips[:5]:
                  log(f'  {ip[4][0]} ({ip[1]})')
          except Exception as e:
              log(f'  DNS failed: {e}')
          
          # TCP ports
          log('')
          log('=== TCP Port Scan ===')
          for test_port, label in [(21, 'FTP'), (22, 'SSH'), (2222, 'Alt SSH'), (990, 'FTPS')]:
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.settimeout(5)
                  result = s.connect_ex((host, test_port))
                  s.close()
                  status = 'OPEN' if result == 0 else f'CLOSED/FILTERED (err={result})'
                  log(f'  Port {test_port:5} ({label:14}): {status}')
              except Exception as e:
                  log(f'  Port {test_port:5} ({label:14}): ERROR {e}')
          
          # FTP tests
          log('')
          log('=== Connection Tests ===')
          
          # Plain FTP
          log(f'1. Plain FTP {host}:{port}')
          try:
              ftp = ftplib.FTP()
              ftp.connect(host, port, timeout=15)
              log(f'   Connected: {ftp.getwelcome()[:80]}')
              ftp.login(user, pwd)
              log(f'   Login OK')
              pwd_resp = ftp.pwd()
              log(f'   PWD: {pwd_resp}')
              ftp.quit()
              log(f'   SUCCESS')
          except Exception as e:
              log(f'   FAILED: {type(e).__name__}: {e}')
          
          # FTP-TLS
          log(f'2. FTP-TLS {host}:{port}')
          try:
              ftps = ftplib.FTP_TLS()
              ftps.connect(host, port, timeout=15)
              log(f'   Connected')
              ftps.login(user, pwd)
              log(f'   Login OK')
              ftps.prot_p()
              log(f'   TLS protection ON')
              ftps.quit()
              log(f'   SUCCESS')
          except Exception as e:
              log(f'   FAILED: {type(e).__name__}: {e}')
          
          # SFTP via paramiko
          log(f'3. SFTP (paramiko) {host}:22')
          try:
              import paramiko
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(host, port=22, username=user, password=pwd, timeout=15, banner_timeout=15)
              log(f'   SSH connected')
              sftp = ssh.open_sftp()
              log(f'   SFTP opened')
              files = sftp.listdir('.')
              log(f'   Home dir: {files[:10]}')
              sftp.close()
              ssh.close()
              log(f'   SUCCESS')
          except ImportError:
              log(f'   paramiko not installed')
          except Exception as e:
              log(f'   FAILED: {type(e).__name__}: {e}')
          
          # SFTP port 2222
          log(f'4. SFTP (paramiko) {host}:2222')
          try:
              import paramiko
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(host, port=2222, username=user, password=pwd, timeout=15, banner_timeout=15)
              log(f'   SSH connected')
              sftp = ssh.open_sftp()
              log(f'   SFTP opened')
              files = sftp.listdir('.')
              log(f'   Home dir: {files[:10]}')
              sftp.close()
              ssh.close()
              log(f'   SUCCESS')
          except ImportError:
              log(f'   paramiko not installed')
          except Exception as e:
              log(f'   FAILED: {type(e).__name__}: {e}')
          
          log('')
          log('=== Diagnostic Complete ===')
          PYEOF

      - name: Save results
        if: always()
        run: |
          echo "$GITHUB_RUN_ID" > /tmp/run-id.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-diagnostic-results
          path: |-
            /tmp/diag-output.txt
            /tmp/run-id.txt
          retention-days: 1
