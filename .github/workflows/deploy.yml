name: Deploy AI Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason (optional)'
        required: false
        default: 'Manual trigger'

concurrency:
  group: aistore-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set absolute DB path
        run: echo "DATABASE_URL=file:$(pwd)/db/custom.db" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx prisma generate

      - name: Verify DB
        run: |
          COUNT=$(node -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(0)})" 2>&1 || echo "0")
          echo "Products in DB: $COUNT"

      - name: Pre-check bAIcoin daemon
        run: |
          echo "Checking bAIcoin daemon health..."
          HTTP_CODE=$(curl -s -o /tmp/bait.json -w '%{http_code}' --max-time 15 "https://www.mybait.org/api/api/v1/status" 2>/dev/null || echo "000")
          echo "bAIcoin daemon HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "bAIcoin ONLINE"
          else
            echo "bAIcoin offline — deploying in simulated wallet mode"
          fi

      - name: Build Next.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /aistore
          NEXT_PUBLIC_BASE_URL: https://www.mybait.org/aistore
        run: npx next build

      - name: Check Standalone output
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "::error::.next/standalone directory does not exist after build"
            exit 1
          fi
          echo ".next/standalone exists — $(du -sh .next/standalone | cut -f1)"

      - name: Inject SESSION_SECRET into .htaccess
        env:
          HG_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -z "$HG_SESSION_SECRET" ]; then
            echo "WARNING: SESSION_SECRET secret not set — adding placeholder that will prevent CGI startup"
            echo "Create a SESSION_SECRET secret in GitHub repo settings (min 16 chars)"
            exit 1
          fi
          sed -i "s/^# (configured during deploy.*)$/SetEnv SESSION_SECRET ${HG_SESSION_SECRET}/" hostgator/root-htaccess
          echo "SESSION_SECRET injected into root-htaccess ($(echo $HG_SESSION_SECRET | wc -c) chars)"

      - name: Package deploy artifact
        run: |
          mkdir -p deploy/standalone
          cp -r .next/standalone/ deploy/standalone/
          mkdir -p deploy/standalone/.next/static
          cp -r .next/static/* deploy/standalone/.next/static/
          mkdir -p deploy/standalone/public
          cp -r public/* deploy/standalone/public/ 2>/dev/null || true
          mkdir -p deploy/standalone/{prisma,db}
          cp prisma/schema.prisma deploy/standalone/prisma/
          cp db/custom.db deploy/standalone/db/
          cp package.json deploy/standalone/
          cp hostgator/aistore-api.cgi hostgator/aistore-test.cgi hostgator/.htaccess hostgator/setup_aistore.sh hostgator/root-htaccess deploy/
          chmod +x deploy/aistore-api.cgi deploy/aistore-test.cgi deploy/setup_aistore.sh
          cd deploy/standalone && tar czf ../aistore-codebase.tar.gz . && cd ../..
          echo "Tarball size: $(du -sh deploy/aistore-codebase.tar.gz | cut -f1)"

      - name: Parse HostGator credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          if [ -z "$HG_CREDS" ]; then
            echo "ERROR: Secret CREDENCIAIS_HOSTGATOR not set"
            echo "Add it at: https://github.com/Nexus-HUB57/AI_Store/settings/secrets/actions"
            exit 1
          fi
          echo "Secret found (${#HG_CREDS} chars)"
          python3 << 'PYEOF'
          import os, json, sys, re
          raw = os.environ['HG_CREDS'].strip()
          host, port, user, pwd = '', '21', '', ''
          
          def clean_val(v):
              v = re.sub(r'^(Host|Port|User|Pass|Password|Senha|Servidor|Usuario|Usuário):\s*', '', v, flags=re.I)
              return v.strip().strip('"').strip("'")

          try:
              c = json.loads(raw)
              host = str(c.get('host', c.get('hostname', '')))
              user = str(c.get('user', c.get('username', '')))
              pwd = str(c.get('password', c.get('pass', '')))
              port = str(c.get('port', '21'))
          except Exception:
              lines = [l.strip() for l in raw.splitlines() if l.strip()]
              kv = {}
              for line in lines:
                  if ':' in line:
                      k, v = line.split(':', 1)
                      kv[k.strip().lower()] = v.strip()
              
              if kv.get('host') or kv.get('hostname') or kv.get('servidor'):
                  host = kv.get('host') or kv.get('hostname') or kv.get('servidor')
                  port = kv.get('port', '21')
                  user = kv.get('user') or kv.get('username') or kv.get('usuário') or kv.get('usuario')
                  pwd = kv.get('password') or kv.get('pass') or kv.get('senha')
              else:
                  parts = [p.strip() for p in raw.replace('\n', ':').split(':') if p.strip()]
                  parts = [clean_val(p) for p in parts]
                  if len(parts) >= 4:
                      host, port, user, pwd = parts[0], parts[1], parts[2], parts[3]
                  elif len(parts) == 3:
                      host, port, user, pwd = parts[0], '21', parts[1], parts[2]

          port = re.sub(r'\D', '', str(port))
          if not port: port = '21'
          host, user, pwd = clean_val(str(host)), clean_val(str(user)), clean_val(str(pwd))

          print(f'Parsed: HOST={host} PORT={port} USER={user} PASS_LEN={len(pwd)}')
          if not host or not user or not pwd:
              print(f'ERROR: Missing fields. Parsed Host={host}, User={user}')
              sys.exit(1)
          
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HOST={host}\n')
              f.write(f'PORT={port}\n')
              f.write(f'USER={user}\n')
              f.write(f'PASS={pwd}\n')
          print('Credentials successfully written to GITHUB_ENV')
          PYEOF

      - name: Test FTP connection
        run: |
          python3 << 'PYEOF'
          import ftplib, os
          host, port, user, pwd = os.environ['HOST'], int(os.environ['PORT']), os.environ['USER'], os.environ['PASS']
          ftps = ftplib.FTP_TLS()
          ftps.connect(host, port, timeout=30)
          ftps.login(user, pwd)
          ftps.prot_p()
          print(f'Connected to {host}:{port} as {user}')
          ftps.quit()
          print('FTP connection OK')
          PYEOF

      - name: Deploy files via FTP
        env:
          HG_HOST: ${{ env.HOST }}
          HG_PORT: ${{ env.PORT }}
          HG_USER: ${{ env.USER }}
          HG_PASS: ${{ env.PASS }}
        run: |
          python3 << 'PYEOF'
          import ftplib, os, sys
          host = os.environ['HG_HOST']
          port = int(os.environ['HG_PORT'])
          user = os.environ['HG_USER']
          pwd = os.environ['HG_PASS']
          files = [
            ('deploy/aistore-api.cgi', 'public_html/aistore-api.cgi'),
            ('deploy/aistore-test.cgi', 'public_html/aistore-test.cgi'),
          ]
          try:
            ftps = ftplib.FTP_TLS()
            ftps.connect(host, port, timeout=30)
            ftps.login(user, pwd)
            ftps.prot_p()
            print(f'Connected to {host}:{port} as {user}')
            for local, remote in files:
              print(f'Uploading {local} -> {remote}')
              with open(local, 'rb') as f:
                ftps.storbinary(f'STOR {remote}', f)
              print(f'  OK')
            # Create aistore dir and upload config
            try: ftps.mkd('public_html/aistore')
            except: pass
            config_files = [
              ('deploy/.htaccess', 'public_html/aistore/.htaccess'),
              ('deploy/setup_aistore.sh', 'public_html/aistore/setup_aistore.sh'),
            ]
            for local, remote in config_files:
              print(f'Uploading {local} -> {remote}')
              with open(local, 'rb') as f:
                ftps.storbinary(f'STOR {remote}', f)
              print(f'  OK')
            # Root .htaccess (atomic replace)
            print('Deploying root .htaccess...')
            with open('deploy/root-htaccess', 'rb') as f:
              ftps.storbinary('STOR public_html/.htaccess.aistore-new', f)
            try: ftps.rename('public_html/.htaccess', 'public_html/.htaccess.bak.aistore')
            except: pass
            ftps.rename('public_html/.htaccess.aistore-new', 'public_html/.htaccess')
            print('Root .htaccess deployed')
            ftps.quit()
            print('All files uploaded successfully')
          except Exception as e:
            print(f'FTP error: {e}', file=sys.stderr)
            sys.exit(1)
          PYEOF

      - name: Deploy codebase tarball
        env:
          HG_HOST: ${{ env.HOST }}
          HG_PORT: ${{ env.PORT }}
          HG_USER: ${{ env.USER }}
          HG_PASS: ${{ env.PASS }}
        run: |
          echo "Tarball: $(du -sh deploy/aistore-codebase.tar.gz | cut -f1)"
          python3 << 'PYEOF'
          import ftplib, os, sys
          host = os.environ['HG_HOST']
          port = int(os.environ['HG_PORT'])
          user = os.environ['HG_USER']
          pwd = os.environ['HG_PASS']
          try:
            ftps = ftplib.FTP_TLS()
            ftps.connect(host, port, timeout=60)
            ftps.login(user, pwd)
            ftps.prot_p()
            print(f'Uploading tarball...')
            with open('deploy/aistore-codebase.tar.gz', 'rb') as f:
              ftps.storbinary('STOR public_html/aistore-codebase.tar.gz', f)
            print('Tarball uploaded')
            ftps.quit()
          except Exception as e:
            print(f'Tarball upload error: {e}', file=sys.stderr)
            sys.exit(1)
          PYEOF

      - name: Run smoke test
        if: always()
        run: |
          echo "=== Deploy Verification ==="
          echo "Waiting 20s for first request (CGI may install Node.js)..."
          sleep 20
          HTTP_CODE=$(curl -s -o /tmp/verify.json -w '%{http_code}' --max-time 120 'https://www.mybait.org/aistore/api/version' 2>/dev/null || echo "000")
          echo "AI Store /api/version: HTTP $HTTP_CODE"
          if [ -s /tmp/verify.json ]; then
            cat /tmp/verify.json | python3 -m json.tool 2>/dev/null || cat /tmp/verify.json
          fi
          echo ""
          echo "=== CGI Direct Test ==="
          curl -sI --max-time 15 'https://www.mybait.org/aistore-test.cgi' 2>/dev/null | head -10 || echo 'test.cgi unreachable'
          if [ "$HTTP_CODE" = "200" ]; then
            echo "DEPLOY SUCCESSFUL"
          else
            echo "WARNING: HTTP $HTTP_CODE — Node.js startup may take 30-60s on cold start"
          fi
