name: Deploy AI Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason (optional)'
        required: false
        default: 'Manual trigger'

concurrency:
  group: aistore-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'file:db/custom.db'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx prisma generate

      - name: Ensure DB directory exists
        run: mkdir -p db

      - name: Verify DB
        run: |
          COUNT=$(node -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(0)})" 2>&1 || echo "0")
          echo "Products in DB: $COUNT"
          if [ "$COUNT" -lt 1 ] 2>/dev/null; then
            echo "DB empty, seeding..."
            npx tsx scripts/seed-full.ts
          fi

      - name: Pre-check bAIcoin daemon
        run: |
          echo "Checking bAIcoin daemon health..."
          HTTP_CODE=$(curl -s -o /tmp/bait.json -w '%{http_code}' --max-time 15 "https://www.mybait.org/api/api/v1/status" 2>/dev/null || echo "000")
          echo "bAIcoin daemon HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "bAIcoin ONLINE"
          else
            echo "bAIcoin offline — deploying in simulated wallet mode"
          fi

      - name: Build Next.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /aistore
          NEXT_PUBLIC_BASE_URL: https://www.mybait.org/aistore
          DATABASE_URL: 'file:db/custom.db'
        run: npm run build

      - name: Package deploy artifact
        run: |
          mkdir -p deploy
          # Move standalone to deploy root
          mv .next/standalone deploy/standalone
          # package.json is already in standalone from npm run build, but let's be sure
          cp package.json deploy/standalone/ 2>/dev/null || true
          # Copy CGI and setup scripts to deploy root (outside standalone)
          cp hostgator/aistore-api.cgi hostgator/aistore-test.cgi hostgator/.htaccess hostgator/setup_aistore.sh deploy/
          chmod +x deploy/aistore-api.cgi deploy/aistore-test.cgi deploy/setup_aistore.sh
          # Create codebase tarball from standalone content
          cd deploy/standalone && tar czf ../aistore-codebase.tar.gz . && cd ../..

      - name: Parse HostGator credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          if [ -z "$HG_CREDS" ]; then
            echo "ERROR: Secret CREDENCIAIS_HOSTGATOR not set"
            echo "Add it at: https://github.com/Nexus-HUB57/AI_Store/settings/secrets/actions"
            exit 1
          fi
          echo "Secret found (${#HG_CREDS} chars)"
          python3 << 'PYEOF'
          import os, json, sys
          raw = os.environ['HG_CREDS'].strip()
          try:
              c = json.loads(raw)
              host, user, pwd = c.get('host',''), c.get('user',''), c.get('password','')
              port = c.get('port', 21)
          except Exception:
              parts = raw.split(':')
              if len(parts) >= 4:
                  host, port, user, pwd = parts[0], parts[1], parts[2], parts[3]
              elif len(parts) == 3:
                  host, port, user, pwd = parts[0], '21', parts[1], parts[2]
              else:
                  print('FORMAT_ERROR', file=sys.stderr)
                  sys.exit(1)
          if not host or not user or not pwd:
              print('MISSING_FIELDS', file=sys.stderr)
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HOST={host}\n')
              f.write(f'PORT={port}\n')
              f.write(f'USER={user}\n')
              f.write(f'PASS={pwd}\n')
          print(f'Parsed: HOST={host} PORT={port} USER={user}')
          PYEOF

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Test FTP connection
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 30;
            pwd;
            ls public_html/aistore/ 2>/dev/null || echo 'aistore dir not yet created';
            bye
          "

      - name: Deploy CGI to root (where CGI handler works)
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set ftp:binary;
            lcd deploy;
            put aistore-api.cgi -o public_html/aistore-api.cgi;
            chmod 755 public_html/aistore-api.cgi;
            put aistore-test.cgi -o public_html/aistore-test.cgi;
            chmod 755 public_html/aistore-test.cgi;
            bye
          "

      - name: Deploy aistore config files
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set ftp:binary;
            mkdir -p public_html/aistore;
            lcd deploy;
            put .htaccess -o public_html/aistore/.htaccess;
            put setup_aistore.sh -o public_html/aistore/setup_aistore.sh;
            chmod 755 public_html/aistore/setup_aistore.sh;
            bye
          "

      - name: Deploy codebase tarball
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 180;
            lcd deploy;
            put aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz;
            bye
          "

      - name: Deploy root .htaccess (non-destructive)
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            rm -f public_html/.htaccess.bak.deploy 2>/dev/null;
            mv public_html/.htaccess public_html/.htaccess.bak.deploy 2>/dev/null;
            bye
          " 2>/dev/null || true
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            put hostgator/root-htaccess -o public_html/.htaccess;
            bye
          "

      - name: Run smoke test
        if: always()
        run: |
          echo "=== Deploy Verification ==="
          sleep 8
          HTTP_CODE=$(curl -s -o /tmp/verify.json -w '%{http_code}' --max-time 60 'https://www.mybait.org/aistore/api/version' 2>/dev/null || echo "000")
          echo "AI Store /api/version: HTTP $HTTP_CODE"
          echo "AI Store test.cgi:"
          curl -s --max-time 15 'https://www.mybait.org/aistore/test.cgi' 2>/dev/null | head -5 || true
          if [ "$HTTP_CODE" = "200" ]; then
            echo "DEPLOY SUCCESSFUL"
            cat /tmp/verify.json | python3 -m json.tool 2>/dev/null || cat /tmp/verify.json
          else
            echo "WARNING: HTTP $HTTP_CODE — Node.js may need ~30s to start. Check manually."
          fi

      - name: Run production smoke test
        if: always()
        run: bash scripts/smoke-test.sh https://www.mybait.org/aistore || true
