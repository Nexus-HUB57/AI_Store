name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator SSH publish'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20.18.0'

concurrency:
  group: deploy-aistore
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx vitest run --reporter=verbose 2>&1 | tail -30

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx prisma generate --datasource-provider sqlite
      - run: npm run build
      - name: Package standalone
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
      - name: Hash artefact
        id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            ## AI Store v1.0.0 — Automated Deploy
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Artifact SHA-256:** ${{ needs.build.outputs.artifact_sha }}

            ### Deploy on HostGator
            ```bash
            bash <(curl -sL https://raw.githubusercontent.com/Nexus-HUB57/AI_Store/main/deploy/deploy-on-server.sh)
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator via SSH
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event.inputs.skip_hostgator != 'true' && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Setup SSH (HostGator)
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.HOSTGATOR_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.HOSTGATOR_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload tarball to HostGator
        run: |
          set -e
          scp -i ~/.ssh/id_deploy \
              -P ${{ secrets.HOSTGATOR_SSH_PORT }} \
              -o StrictHostKeyChecking=yes \
              aistore-standalone.tar.gz \
              ${{ secrets.HOSTGATOR_SSH_USER }}@${{ secrets.HOSTGATOR_SSH_HOST }}:~/public_html/aistore-codebase.tar.gz

      - name: Extract + restart on HostGator
        run: |
          set -e
          ssh -i ~/.ssh/id_deploy \
              -p ${{ secrets.HOSTGATOR_SSH_PORT }} \
              -o StrictHostKeyChecking=yes \
              ${{ secrets.HOSTGATOR_SSH_USER }}@${{ secrets.HOSTGATOR_SSH_HOST }} \
              "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"

      - name: Verify HostGator deploy
        run: |
          set -e
          echo "Aguardando AI Store subir (max 90s)..."
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API up depois de ${i} tentativas"
              break
            fi
            sleep 3
          done
          test "$(curl -sSf -o /dev/null -w '%{http_code}' https://www.mybait.org/aistore/api/stats)" = "200"
          python3 - <<'PY'
          import json,sys
          s=json.load(open('/tmp/stats.json'))
          req=['total','categories','avgPulsarEnergy','totalDownloads','totalExecutions','featuredCount']
          missing=[k for k in req if k not in s]
          if missing:
              print('FAIL missing keys:',missing); sys.exit(1)
          print(f"OK total={s['total']} categorias={len(s['categories'])} downloads={s['totalDownloads']} execucoes={s['totalExecutions']} featured={s['featuredCount']}")
          assert s['total'] > 0, 'AI Store sem produtos'
          assert len(s['categories']) >= 1, 'AI Store sem categorias'
          PY

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- artefato aistore-standalone.tar.gz publicado em ~/public_html/aistore-codebase.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- deploy-manual.sh executado no HostGator" >> $GITHUB_STEP_SUMMARY
          echo "- /aistore/api/stats validado (total, categorias, KPIs)" >> $GITHUB_STEP_SUMMARY
