name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator publish'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20.18.0'
  DATABASE_URL: 'file:./db/custom.db'
  NEXT_PUBLIC_BASE_PATH: '/aistore'
  NEXT_PUBLIC_BASE_URL: 'https://www.mybait.org/aistore'
  SESSION_SECRET: 'ci-build-only-not-for-production-16c'

concurrency:
  group: deploy-aistore
  cancel-in-progress: false

jobs:
  validate-secrets:
    name: Validate Secrets & Env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build env (CI placeholder OK)
        run: node scripts/validate-ci-env.mjs build
      - name: Validate deploy secrets (presence only — values masked)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CREDENCIAIS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
          CREDENCIAIS_PLATAFORMA_BAIT: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
        run: |
          node scripts/validate-ci-env.mjs deploy
          echo ""
          echo "::notice::HostGator runtime still needs SetEnv SESSION_SECRET in public_html/.htaccess"
          echo "::notice::FTP path does not inject SESSION_SECRET into the Node process automatically"

  test:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx vitest run --reporter=verbose 2>&1 | tail -30

  build:
    runs-on: ubuntu-latest
    needs: [test, validate-secrets]
    if: always() && needs.validate-secrets.result == 'success' && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Ensure SQLite DB path for SSG
        run: |
          mkdir -p db
          if [ ! -f db/custom.db ]; then
            npx prisma db push --skip-generate || true
          fi
      - run: npx prisma generate
      - run: npm run build
      - name: Package standalone
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
      - name: Hash artefact
        id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            ## AI Store v1.0.0
            Commit: ${{ github.sha }}
            SHA-256: ${{ needs.build.outputs.artifact_sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator (SSH or FTP)
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event.inputs.skip_hostgator != 'true' && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Resolve credentials
        id: creds
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_PORT_S: ${{ secrets.SSH_PORT }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
          SSH_KEY_S: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST_S: ${{ secrets.VPS_HOST }}
          VPS_PORT_S: ${{ secrets.VPS_PORT }}
          VPS_USER_S: ${{ secrets.VPS_USER }}
          VPS_KEY_S: ${{ secrets.VPS_SSH_KEY }}
          CREDS_PLATAFORMA: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
          CREDS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          set -e
          python3 << 'PY'
          import os, json, re, pathlib, base64, subprocess

          def clean(s):
              if s is None:
                  return ''
              return re.sub(r'[\r\n\t "\']', '', str(s)).strip()

          st = {
              'host': clean(os.environ.get('SSH_HOST_S') or os.environ.get('VPS_HOST_S')),
              'port': clean(os.environ.get('SSH_PORT_S') or os.environ.get('VPS_PORT_S')),
              'user': clean(os.environ.get('SSH_USER_S') or os.environ.get('VPS_USER_S')),
              'key': (os.environ.get('SSH_KEY_S') or os.environ.get('VPS_KEY_S') or '').strip(),
              'password': '',
          }

          def merge_json(raw, label):
              if not raw or not str(raw).strip():
                  print(f'  {label}: empty')
                  return
              text = str(raw).strip()
              if (text.startswith("'") and text.endswith("'")) or (text.startswith('"') and text.endswith('"')):
                  text = text[1:-1]
              try:
                  c = json.loads(text)
              except Exception as e:
                  print(f'  {label}: not JSON ({e})')
                  return
              if not isinstance(c, dict):
                  return
              print(f'  {label}: keys={sorted(c.keys())}')
              st['host'] = st['host'] or clean(c.get('host') or c.get('ssh_host') or c.get('hostname') or c.get('ip') or c.get('ftp_host'))
              st['user'] = st['user'] or clean(c.get('user') or c.get('ssh_user') or c.get('username') or c.get('ftp_user'))
              p = c.get('port') or c.get('ssh_port') or c.get('ftp_port')
              if p is not None and str(p).strip():
                  st['port'] = clean(str(p))
              k = c.get('private_key') or c.get('ssh_key') or c.get('ssh_private_key') or c.get('key') or ''
              if k and not st['key']:
                  st['key'] = str(k).strip()
              pw = c.get('password') or c.get('pass') or c.get('ftp_pass') or c.get('ftp_password') or ''
              if pw and not st['password']:
                  st['password'] = str(pw)

          merge_json(os.environ.get('CREDS_PLATAFORMA'), 'CREDENCIAIS_PLATAFORMA_BAIT')
          merge_json(os.environ.get('CREDS_HOSTGATOR'), 'CREDENCIAIS_HOSTGATOR')

          host, port, user = st['host'], st['port'], st['user']
          key, password = st['key'], st['password']

          if not host or not user:
              print('::error::host/user vazios apos resolve')
              raise SystemExit(1)

          key_path = pathlib.Path.home() / '.ssh_key_resolved'
          key_ok = False
          if key:
              body = key.replace('\\n', '\n')
              if 'BEGIN' not in body:
                  try:
                      decoded = base64.b64decode(re.sub(r'\s+', '', body))
                      if b'BEGIN' in decoded:
                          body = decoded.decode()
                  except Exception:
                      pass
              key_path.write_text(body if body.endswith('\n') else body + '\n')
              key_path.chmod(0o600)
              key_ok = subprocess.call(
                  ['ssh-keygen', '-y', '-f', str(key_path)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ) == 0
              print(f'  key_ok={key_ok} bytes={key_path.stat().st_size if key_path.exists() else 0}')

          if password and (not key_ok or port in ('21', '990', '989', '')):
              mode = 'ftp'
              if not port or port in ('22',):
                  if not key_ok:
                      port = port if port in ('21', '990', '989') else '21'
              if not port:
                  port = '21'
          elif key_ok:
              mode = 'ssh'
              if not port:
                  port = '22'
          elif password:
              mode = 'ftp'
              port = port or '21'
          else:
              print('::error::Nem private_key valida nem password FTP disponiveis')
              raise SystemExit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HG_HOST={host}\n')
              f.write(f'HG_PORT={port}\n')
              f.write(f'HG_USER={user}\n')
              f.write(f'HG_MODE={mode}\n')
              if password:
                  pass_file = pathlib.Path.home() / '.hg_pass'
                  pass_file.write_text(password)
                  pass_file.chmod(0o600)
                  f.write(f'HG_PASS_FILE={pass_file}\n')

          print(f'  resolved mode={mode} host={host} port={port} user={user} key_ok={key_ok} has_pass={bool(password)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write(f'mode={mode}\n')
          PY

      - name: Setup SSH + probe
        if: steps.creds.outputs.mode == 'ssh'
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/id_deploy"
          cp "$HOME/.ssh_key_resolved" "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          {
            echo "Host deploy-target"
            echo "  HostName $HG_HOST"
            echo "  Port $HG_PORT"
            echo "  User $HG_USER"
            echo "  IdentityFile $KEY_FILE"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 20"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 8 -p "$HG_PORT" -H "$HG_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes deploy-target 'echo remote-ok && hostname && whoami'

      - name: Upload + restart (SSH)
        if: steps.creds.outputs.mode == 'ssh'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          scp aistore-standalone.tar.gz deploy-target:~/public_html/aistore-codebase.tar.gz
          if [ -n "${SESSION_SECRET:-}" ] && [ ${#SESSION_SECRET} -ge 16 ]; then
            ssh deploy-target "export SESSION_SECRET=$(printf %q "$SESSION_SECRET"); bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          else
            echo "::warning::secrets.SESSION_SECRET missing — remote deploy-manual may fail or login will 500"
            ssh deploy-target "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          fi

      - name: Install lftp
        if: steps.creds.outputs.mode == 'ftp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP (tarball + CGI)
        if: steps.creds.outputs.mode == 'ftp'
        run: |
          set -e
          PASS=$(cat "$HG_PASS_FILE")
          echo "FTP mode → $HG_USER@$HG_HOST:$HG_PORT"

          mkdir -p /tmp/aistore-pkg
          for f in hostgator/aistore-api.cgi hostgator/api.cgi hostgator/.htaccess \
                   hostgator/setup_aistore.sh hostgator/deploy-manual.sh \
                   deploy/aistore-api.cgi deploy/.htaccess deploy/setup_aistore.sh \
                   deploy/deploy-on-server.sh; do
            [ -f "$f" ] && cp "$f" "/tmp/aistore-pkg/$(basename "$f")" && echo "  pack $(basename "$f")"
          done
          cp aistore-standalone.tar.gz /tmp/aistore-codebase.tar.gz

          python3 - <<'PY'
          import os
          host=os.environ['HG_HOST']
          port=os.environ['HG_PORT']
          user=os.environ['HG_USER']
          password=open(os.environ['HG_PASS_FILE']).read()
          lines=[
            'set ftp:ssl-force true',
            'set ssl:verify-certificate no',
            'set net:timeout 180',
            'set net:max-retries 3',
            'set ftp:passive-mode true',
            f'open -p {port} -u {user},{password} {host}',
            'mkdir -p public_html/aistore',
            'put /tmp/aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz',
          ]
          import pathlib
          pkg=pathlib.Path('/tmp/aistore-pkg')
          if (pkg/'aistore-api.cgi').exists():
            lines += ['put /tmp/aistore-pkg/aistore-api.cgi -o public_html/aistore/api.cgi', 'chmod 755 public_html/aistore/api.cgi']
          elif (pkg/'api.cgi').exists():
            lines += ['put /tmp/aistore-pkg/api.cgi -o public_html/aistore/api.cgi', 'chmod 755 public_html/aistore/api.cgi']
          if (pkg/'.htaccess').exists():
            lines.append('put /tmp/aistore-pkg/.htaccess -o public_html/aistore/.htaccess')
          if (pkg/'setup_aistore.sh').exists():
            lines += ['put /tmp/aistore-pkg/setup_aistore.sh -o public_html/aistore/setup_aistore.sh', 'chmod 755 public_html/aistore/setup_aistore.sh']
          if (pkg/'deploy-manual.sh').exists():
            lines += ['put /tmp/aistore-pkg/deploy-manual.sh -o public_html/deploy-manual.sh', 'chmod 755 public_html/deploy-manual.sh']
          if (pkg/'deploy-on-server.sh').exists():
            lines += ['put /tmp/aistore-pkg/deploy-on-server.sh -o public_html/deploy-on-server.sh', 'chmod 755 public_html/deploy-on-server.sh']
          lines.append('bye')
          pathlib.Path('/tmp/lftp_run.txt').write_text('\n'.join(lines)+'\n')
          print('lftp lines', len(lines))
          PY

          lftp -f /tmp/lftp_run.txt
          echo "[+] FTP upload complete"

      - name: Try remote extract via webhook
        if: steps.creds.outputs.mode == 'ftp'
        continue-on-error: true
        run: |
          set +e
          for url in \
            "https://www.mybait.org/deploy-webhook.php" \
            "https://www.mybait.org/aistore/api/health"
          do
            code=$(curl -sS -o /tmp/hook.out -w "%{http_code}" --max-time 20 "$url" || echo 000)
            echo "  probe $url → $code"
          done
          echo "::notice::Se o Node nao reiniciou: bash ~/public_html/deploy-manual.sh no Terminal cPanel"

      - name: Verify HostGator deploy
        run: |
          set -e
          echo "Aguardando API (max 90s) mode=$HG_MODE..."
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then ok=1; echo "API up ($i)"; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::api/stats nao 200 apos upload — extract/restart pode ser necessario no servidor"
            exit 0
          fi
          python3 -c "import json;s=json.load(open('/tmp/stats.json'));print('OK total',s.get('total'));assert s.get('total',0)>0"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- mode: \`${{ steps.creds.outputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- tarball → public_html/aistore-codebase.tar.gz" >> $GITHUB_STEP_SUMMARY
