name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator SSH publish'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20.18.0'
  DATABASE_URL: 'file:./db/custom.db'
  NEXT_PUBLIC_BASE_PATH: '/aistore'
  NEXT_PUBLIC_BASE_URL: 'https://www.mybait.org/aistore'
  SESSION_SECRET: 'ci-build-only-not-for-production-16c'

concurrency:
  group: deploy-aistore
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx vitest run --reporter=verbose 2>&1 | tail -30

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Ensure SQLite DB path for SSG
        run: |
          mkdir -p db
          if [ ! -f db/custom.db ]; then
            echo "::warning::db/custom.db missing — generating empty schema for build"
            npx prisma db push --skip-generate || true
          fi
          ls -la db/ || true
      - run: npx prisma generate
      - run: npm run build
      - name: Package standalone
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
      - name: Hash artefact
        id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            ## AI Store v1.0.0 — Automated Deploy
            **Commit:** ${{ github.sha }}
            **Artifact SHA-256:** ${{ needs.build.outputs.artifact_sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator via SSH
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event.inputs.skip_hostgator != 'true' && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Resolve credentials (SSH_* or CREDENCIAIS_PLATAFORMA_BAIT)
        id: creds
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_PORT_S: ${{ secrets.SSH_PORT }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
          SSH_KEY_S: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST_S: ${{ secrets.VPS_HOST }}
          VPS_PORT_S: ${{ secrets.VPS_PORT }}
          VPS_USER_S: ${{ secrets.VPS_USER }}
          VPS_KEY_S: ${{ secrets.VPS_SSH_KEY }}
          CREDS_PLATAFORMA: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
          CREDS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          set -e
          python3 << 'PY'
          import os, json, re, pathlib, base64

          def clean(s):
              if s is None:
                  return ''
              return re.sub(r'[\r\n\t "\']', '', str(s)).strip()

          host = clean(os.environ.get('SSH_HOST_S') or os.environ.get('VPS_HOST_S'))
          port = clean(os.environ.get('SSH_PORT_S') or os.environ.get('VPS_PORT_S')) or '22'
          user = clean(os.environ.get('SSH_USER_S') or os.environ.get('VPS_USER_S'))
          key  = (os.environ.get('SSH_KEY_S') or os.environ.get('VPS_KEY_S') or '').strip()

          def merge_json(raw, label):
              global host, port, user, key
              if not raw or not str(raw).strip():
                  print(f'  {label}: empty')
                  return
              text = str(raw).strip()
              # strip accidental wrapping quotes
              if (text.startswith("'") and text.endswith("'")) or (text.startswith('"') and text.endswith('"')):
                  text = text[1:-1]
              try:
                  c = json.loads(text)
              except Exception as e:
                  print(f'  {label}: not JSON ({e})')
                  return
              if not isinstance(c, dict):
                  print(f'  {label}: JSON is not object')
                  return
              print(f'  {label}: keys={sorted(c.keys())}')
              host = host or clean(c.get('host') or c.get('ssh_host') or c.get('hostname') or c.get('ip'))
              user = user or clean(c.get('user') or c.get('ssh_user') or c.get('username'))
              port = clean(str(c.get('port') or c.get('ssh_port') or port or '22')) or '22'
              k = c.get('private_key') or c.get('ssh_key') or c.get('ssh_private_key') or c.get('key') or ''
              if k and not key:
                  key = str(k).strip()
              # password-only JSON cannot drive key-based SSH; note it
              if c.get('password') and not key:
                  print(f'  {label}: has password but no private_key — SSH key auth still required')

          merge_json(os.environ.get('CREDS_PLATAFORMA'), 'CREDENCIAIS_PLATAFORMA_BAIT')
          merge_json(os.environ.get('CREDS_HOSTGATOR'), 'CREDENCIAIS_HOSTGATOR')

          if not host:
              print('::error::SSH host vazio (SSH_HOST / VPS_HOST / CREDENCIAIS_*.host)')
              raise SystemExit(1)
          if not user:
              print('::error::SSH user vazio (SSH_USER / VPS_USER / CREDENCIAIS_*.user)')
              raise SystemExit(1)
          if not key:
              print('::error::SSH private key vazia (SSH_PRIVATE_KEY / VPS_SSH_KEY / CREDENCIAIS_*.private_key)')
              raise SystemExit(1)

          pathlib.Path(os.environ['GITHUB_ENV']).open('a').write(
              f'HG_HOST={host}\nHG_PORT={port}\nHG_USER={user}\n'
          )
          # write key to file for next step (avoid env multiline issues)
          key_path = pathlib.Path.home() / '.ssh_key_resolved'
          # support base64 one-liner
          body = key.replace('\\n', '\n')
          if 'BEGIN' not in body:
              try:
                  decoded = base64.b64decode(re.sub(r'\s+', '', body))
                  if b'BEGIN' in decoded:
                      body = decoded.decode()
                      print('  key: decoded from base64')
              except Exception:
                  pass
          key_path.write_text(body if body.endswith('\n') else body + '\n')
          key_path.chmod(0o600)
          print(f'  resolved host={host} port={port} user={user} key_bytes={key_path.stat().st_size}')
          PY

      - name: Setup SSH + probe
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/id_deploy"
          cp "$HOME/.ssh_key_resolved" "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::Chave privada invalida apos resolve (PEM/base64)"
            exit 1
          fi
          echo "  fingerprint: $(ssh-keygen -lf "$KEY_FILE" | awk '{print $2}')"

          {
            echo "Host deploy-target"
            echo "  HostName $HG_HOST"
            echo "  Port $HG_PORT"
            echo "  User $HG_USER"
            echo "  IdentityFile $KEY_FILE"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ServerAliveInterval 30"
            echo "  ConnectTimeout 20"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          : > ~/.ssh/known_hosts
          ssh-keyscan -T 8 -p "$HG_PORT" -H "$HG_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err || true
          chmod 644 ~/.ssh/known_hosts

          if ! ssh -o BatchMode=yes deploy-target 'echo remote-ok && hostname && whoami'; then
            echo "::error::Probe SSH falhou com credenciais resolvidas"
            exit 1
          fi
          echo "  Setup SSH OK"

      - name: Upload tarball to HostGator
        run: |
          set -e
          scp aistore-standalone.tar.gz deploy-target:~/public_html/aistore-codebase.tar.gz

      - name: Extract + restart on HostGator
        run: |
          set -e
          ssh deploy-target "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"

      - name: Verify HostGator deploy
        run: |
          set -e
          echo "Aguardando AI Store subir (max 90s)..."
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API up depois de ${i} tentativas"
              break
            fi
            sleep 3
          done
          test "$(curl -sSf -o /dev/null -w '%{http_code}' https://www.mybait.org/aistore/api/stats)" = "200"
          python3 - <<'PY'
          import json,sys
          s=json.load(open('/tmp/stats.json'))
          req=['total','categories','avgPulsarEnergy','totalDownloads','totalExecutions','featuredCount']
          missing=[k for k in req if k not in s]
          if missing:
              print('FAIL missing keys:',missing); sys.exit(1)
          print(f"OK total={s['total']} categorias={len(s['categories'])}")
          assert s['total'] > 0
          PY

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- credenciais: SSH_* / VPS_* / CREDENCIAIS_PLATAFORMA_BAIT / CREDENCIAIS_HOSTGATOR" >> $GITHUB_STEP_SUMMARY
