name: Deploy AI Store

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'hostgator/**'
      - 'scripts/seed-full.ts'
      - 'db/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check b'AI'tcoin daemon health
        run: |
          echo "Checking b'AI'tcoin daemon at https://www.mybait.org/api/api/v1/status ..."
          HTTP_CODE=$(curl -s -o /tmp/bait-response.json -w '%{http_code}' --max-time 15 "https://www.mybait.org/api/api/v1/status" 2>/dev/null || echo "000")
          echo "b'AI'tcoin daemon HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "b'AI'tcoin daemon is ONLINE — safe to deploy AI Store"
            cat /tmp/bait-response.json | python3 -m json.tool 2>/dev/null | head -10 || true
          else
            echo "WARNING: b'AI'tcoin daemon returned HTTP $HTTP_CODE"
            echo "AI Store will deploy in fallback-simulated wallet mode"
            echo "The wallet SDK v2 will automatically switch to live mode when daemon recovers"
          fi

  build-and-deploy:
    needs: pre-check
    runs-on: ubuntu-latest
    concurrency:
      group: aistore-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - name: Seed DB
        run: |
          COUNT=$(node -e "const{PrismaClient}=require('@prisma/client');new PrismaClient().product.count().then(c=>{console.log(c);process.exit(c>0?0:1)})" 2>/dev/null || echo "0")
          if [ "$COUNT" = "0" ]; then
            npx tsx scripts/seed-full.ts
          fi
      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /aistore
          NEXT_PUBLIC_BASE_URL: https://www.mybait.org/aistore
        run: npx next build
      - name: Package
        run: |
          mkdir -p deploy/standalone
          cp -r .next/standalone/ deploy/standalone/
          mkdir -p deploy/standalone/.next/static
          cp -r .next/static/* deploy/standalone/.next/static/
          mkdir -p deploy/standalone/public
          cp -r public/* deploy/standalone/public/ 2>/dev/null || true
          mkdir -p deploy/standalone/{prisma,db}
          cp prisma/schema.prisma deploy/standalone/prisma/
          cp db/custom.db deploy/standalone/db/
          cp package.json deploy/standalone/
          cp hostgator/api.cgi hostgator/.htaccess hostgator/setup_aistore.sh deploy/
          chmod +x deploy/api.cgi deploy/setup_aistore.sh
          cd deploy/standalone && tar czf ../aistore-codebase.tar.gz . && cd ../..
      - name: Parse credentials
        env:
          HG_CREDS: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          if [ -z "$HG_CREDS" ]; then
            echo "ERROR: Secret CREDENCIAIS_HOSTGATOR not set in AI_Store repo"
            echo "Go to: https://github.com/Nexus-HUB57/AI_Store/settings/secrets/actions"
            echo "Add secret: CREDENCIAIS_HOSTGATOR (copy from b-AI-tcoin repo secrets)"
            exit 1
          fi
          eval "$(python3 -c \"import os,json;c=json.loads(os.environ['HG_CREDS']);print('HOST='+c.get('host',''));print('USER='+c.get('user',''));print('PASS='+c.get('password',''));print('PORT='+str(c.get('port',21)))\")"
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "ERROR: Missing credentials"
            exit 1
          fi
          echo "HOST=$HOST" >> $GITHUB_ENV
          echo "USER=$USER" >> $GITHUB_ENV
          echo "PASS=$PASS" >> $GITHUB_ENV
          echo "PORT=$PORT" >> $GITHUB_ENV
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Deploy files
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:timeout 60; mkdir -p public_html/aistore; lcd deploy; put api.cgi -o public_html/aistore/api.cgi; chmod 755 public_html/aistore/api.cgi; put .htaccess -o public_html/aistore/.htaccess; put setup_aistore.sh -o public_html/aistore/setup_aistore.sh; chmod 755 public_html/aistore/setup_aistore.sh; bye"
      - name: Deploy codebase
        run: |
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:timeout 180; lcd deploy; put aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz; bye"
      - name: Fix root .htaccess (non-destructive via lftp)
        run: |
          echo "=== Downloading current root .htaccess ==="
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            cat public_html/.htaccess -o /tmp/root_htaccess.txt;
            bye
          " 2>/dev/null || { echo "No existing .htaccess, will create new"; echo "" > /tmp/root_htaccess.txt; }

          echo "=== Fixing .htaccess locally ==="
          python3 << 'PYFIX'
          import re
          with open('/tmp/root_htaccess.txt', 'r') as f:
              content = f.read()
          print(f"Downloaded .htaccess: {len(content)} bytes, {len(content.splitlines())} lines")

          original = content

          # 1. Remove Options +ExecCGI (causes 500 on HostGator shared hosting)
          content = re.sub(r'^Options\s\+ExecCGI.*$\n?', '', content, flags=re.MULTILINE)
          if content != original:
              print("FIXED: Removed 'Options +ExecCGI' (causes 500 on shared hosting)")
          else:
              print("OK: No 'Options +ExecCGI' found")

          # 2. Ensure AddHandler cgi-script .cgi is present
          if 'AddHandler cgi-script' not in content:
              content = 'AddHandler cgi-script .cgi\n' + content
              print("FIXED: Added 'AddHandler cgi-script .cgi'")
          else:
              print("OK: AddHandler cgi-script present")

          # 3. Ensure /aistore exclusion exists before api.cgi RewriteRule
          if 'RewriteRule' in content and 'api.cgi' in content and '!^/aistore' not in content:
              content = content.replace(
                  'RewriteRule ^api/(.*)$ /api.cgi/$1',
                  'RewriteCond %{REQUEST_URI} !^/aistore\n  RewriteRule ^api/(.*)$ /api.cgi/$1'
              )
              print("FIXED: Added /aistore exclusion to b'AI'tcoin API rule")
          elif '!^/aistore' in content:
              print("OK: /aistore exclusion present")

          with open('/tmp/root_htaccess_fixed.txt', 'w') as f:
              f.write(content)
          print(f"Fixed .htaccess: {len(content)} bytes")
          PYFIX

          echo "=== Uploading fixed .htaccess ==="
          lftp -u "$USER","$PASS" -p "$PORT" "$HOST" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            put /tmp/root_htaccess_fixed.txt -o public_html/.htaccess;
            bye
          "
          echo "Root .htaccess fixed and uploaded successfully"
      - name: Verify deployment
        if: always()
        run: |
          echo "=== Deploy Verification ==="
          echo "AI Store:     https://www.mybait.org/aistore/"
          echo "Health Check: https://www.mybait.org/aistore/api/health"
          echo "Version:      https://www.mybait.org/aistore/api/version"
          echo "b'AI'tcoin:    https://www.mybait.org/api/api/v1/status"
          echo ""
          echo "=== Live Health Check ==="
          sleep 5
          HTTP_CODE=$(curl -s -o /tmp/verify.json -w '%{http_code}' --max-time 60 'https://www.mybait.org/aistore/api/version' 2>/dev/null || echo "000")
          echo "AI Store /api/version HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "DEPLOY SUCCESSFUL"
            cat /tmp/verify.json | python3 -m json.tool 2>/dev/null || cat /tmp/verify.json
          else
            echo "WARNING: AI Store returned HTTP $HTTP_CODE"
            echo "The first request triggers Node.js setup (~30s). Try again in 60s."
            echo "If still failing, check: https://www.mybait.org/aistore/api/health"
          fi
          echo ""
          HTTP_BAIT=$(curl -s -o /tmp/bait-verify.json -w '%{http_code}' --max-time 15 'https://www.mybait.org/api/api/v1/status' 2>/dev/null || echo "000")
          echo "b'AI'tcoin daemon HTTP status: $HTTP_BAIT"
          if [ "$HTTP_BAIT" = "200" ]; then
            echo "b'AI'tcoin daemon ONLINE"
          else
            echo "b'AI'tcoin daemon offline — AI Store will use simulated wallet mode"
          fi
