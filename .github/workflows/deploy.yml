name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator publish'
        required: false
        default: 'false'
        type: boolean
      prefer_ssh:
        description: 'Force SSH mode when key present (ignore FTP port 21)'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '20.18.0'
  DATABASE_URL: 'file:./db/custom.db'
  NEXT_PUBLIC_BASE_PATH: '/aistore'
  NEXT_PUBLIC_BASE_URL: 'https://www.mybait.org/aistore'
  SESSION_SECRET: 'ci-build-only-not-for-production-16c'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: deploy-aistore-production
  cancel-in-progress: true

jobs:
  validate-secrets:
    name: Validate Secrets & Env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build env
        run: node scripts/validate-ci-env.mjs build
      - name: Validate deploy secrets (presence only)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          HOSTGATOR_SHARED_IP: ${{ secrets.HOSTGATOR_SHARED_IP }}
          HOSTGATOR_SERVER: ${{ secrets.HOSTGATOR_SERVER }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          CREDENCIAIS_AI_STORE: ${{ secrets.CREDENCIAIS_AI_STORE }}
          CREDENCIAIS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
        run: |
          node scripts/validate-ci-env.mjs deploy
          echo "::notice::SSH_PRIVATE_KEY=$([ -n \"${SSH_PRIVATE_KEY:-}\" ] && echo yes || echo NO)"
          echo "::notice::SSH_KEY_PASSPHRASE=$([ -n \"${SSH_KEY_PASSPHRASE:-}\" ] && echo yes || echo NO)"
          echo "::notice::CREDENCIAIS_AI_STORE=$([ -n \"${CREDENCIAIS_AI_STORE:-}\" ] && echo yes || echo NO)"
          echo "::notice::CREDENCIAIS_HOSTGATOR=$([ -n \"${CREDENCIAIS_HOSTGATOR:-}\" ] && echo yes || echo NO)"
          echo "::notice::hosts SSH/SHARED_IP/SERVER=$([ -n \"${SSH_HOST:-}\" ] && echo y || echo n)/$([ -n \"${HOSTGATOR_SHARED_IP:-}\" ] && echo y || echo n)/$([ -n \"${HOSTGATOR_SERVER:-}\" ] && echo y || echo n)"

  test:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: mkdir -p db && npx prisma generate && npx prisma db push
      - run: npx vitest run --reporter=verbose 2>&1 | tail -40

  build:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    if: always() && needs.validate-secrets.result == 'success'
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sync Prisma schema (always)
        run: |
          mkdir -p db
          npx prisma db push --skip-generate --accept-data-loss
      - run: npx prisma generate
      - name: Build Next.js (basePath=/aistore)
        run: npm run build
      - name: Package standalone tarball
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
          ls -lh ../../aistore-standalone.tar.gz
      - id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aistore-v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            AI Store production artifact
            Commit: ${{ github.sha }}
            SHA-256: ${{ needs.build.outputs.artifact_sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator (SSH preferred)
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' && github.event.inputs.skip_hostgator != 'true' }}
    timeout-minutes: 25
    environment:
      name: production
      url: https://www.mybait.org/aistore/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Resolve credentials (SSH > FTP)
        id: creds
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_PORT_S: ${{ secrets.SSH_PORT }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
          SSH_KEY_S: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          HOSTGATOR_SHARED_IP: ${{ secrets.HOSTGATOR_SHARED_IP }}
          HOSTGATOR_SERVER: ${{ secrets.HOSTGATOR_SERVER }}
          FTP_HOST_S: ${{ secrets.FTP_HOST }}
          FTP_PORT_S: ${{ secrets.FTP_PORT }}
          FTP_USER_S: ${{ secrets.FTP_USER }}
          FTP_PASS_S: ${{ secrets.FTP_PASS }}
          CREDS_AI_STORE: ${{ secrets.CREDENCIAIS_AI_STORE }}
          CREDS_PLATAFORMA: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
          CREDS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
          PREFER_SSH: ${{ github.event.inputs.prefer_ssh || 'true' }}
        run: |
          set -e
          python3 << 'PY'
          import os, json, re, pathlib, base64, subprocess, socket

          def clean(s):
              if s is None: return ''
              return re.sub(r'[\r\n\t "\']', '', str(s)).strip()

          st = {
              'hosts': [],
              'port': clean(os.environ.get('SSH_PORT_S') or '22') or '22',
              'user': clean(os.environ.get('SSH_USER_S') or os.environ.get('FTP_USER_S')),
              'key': (os.environ.get('SSH_KEY_S') or '').strip(),
              'passphrase': '',
              'password': (os.environ.get('FTP_PASS_S') or '').strip(),
              'passphrase_source': 'none',
              'vnc_host': '',
              'vnc_port': '',
          }

          def add_host(h, label):
              h = clean(h)
              if h and h not in [x[0] for x in st['hosts']]:
                  st['hosts'].append((h, label))
                  print(f'  host_candidate {label}=set')

          # 1) Dedicated passphrase secret (highest priority)
          for envk in ('SSH_KEY_PASSPHRASE', 'SSH_PASSPHRASE', 'KEY_PASSPHRASE', 'PASSPHRASE'):
              v = (os.environ.get(envk) or '').strip()
              print(f'  secret_present {envk}={"yes" if v else "NO"}')
              if v and not st['passphrase']:
                  st['passphrase'] = v
                  st['passphrase_source'] = envk
                  print(f'  passphrase_from_secret={envk} len={len(v)}')

          def merge_json(raw, label):
              if not raw or not str(raw).strip():
                  print(f'  {label}: empty'); return
              text = str(raw).strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "'\"":
                  text = text[1:-1]
              try:
                  c = json.loads(text)
              except Exception as e:
                  print(f'  {label}: not JSON ({e})'); return
              if not isinstance(c, dict):
                  return
              # Support nested {ssh:{}, ftp:{}, vnc:{}} or flat keys
              flat = dict(c)
              for nest in ('ssh', 'ftp', 'vnc', 'hostgator', 'deploy', 'sftp'):
                  if isinstance(c.get(nest), dict):
                      for nk, nv in c[nest].items():
                          flat.setdefault(nk if nest == 'ssh' else f'{nest}_{nk}', nv)
                      # also promote nested ssh fields without prefix
                      if nest == 'ssh':
                          for nk, nv in c[nest].items():
                              flat.setdefault(nk, nv)
              print(f'  {label}: keys={sorted(flat.keys())[:40]}')

              for k in ('host', 'ssh_host', 'hostname', 'ip', 'ftp_host', 'server',
                        'ssh_hostname', 'vnc_host', 'shared_ip'):
                  if flat.get(k):
                      add_host(flat.get(k), f'{label}.{k}')

              st['user'] = st['user'] or clean(
                  flat.get('user') or flat.get('ssh_user') or flat.get('username')
                  or flat.get('ftp_user') or flat.get('sftp_user')
              )
              # Prefer dedicated SSH port over generic/ftp
              p = flat.get('ssh_port') or flat.get('port')
              if p is not None and str(p).strip() and clean(str(p)) not in ('21', '990', '989'):
                  st['port'] = clean(str(p))

              k = (flat.get('private_key') or flat.get('ssh_key') or flat.get('ssh_private_key')
                   or flat.get('key') or '')
              if k and not st['key']:
                  st['key'] = str(k).strip()

              pw = (flat.get('password') or flat.get('pass') or flat.get('ftp_pass')
                    or flat.get('ftp_password') or flat.get('sftp_password') or '')
              if pw and not st['password']:
                  st['password'] = str(pw)

              pp = (flat.get('ssh_passphrase') or flat.get('key_passphrase')
                    or flat.get('ssh_key_passphrase') or flat.get('passphrase')
                    or flat.get('SSH_KEY_PASSPHRASE') or '')
              if pp and not st['passphrase']:
                  st['passphrase'] = str(pp).strip()
                  st['passphrase_source'] = f'{label}.passphrase'
                  print(f'  passphrase_from_json={label} len={len(st["passphrase"])}')

              if flat.get('vnc_host') or flat.get('vnc_port'):
                  st['vnc_host'] = clean(flat.get('vnc_host') or '')
                  st['vnc_port'] = clean(str(flat.get('vnc_port') or ''))
                  print(f'  vnc_hint host={bool(st["vnc_host"])} port={st["vnc_port"] or "-"}')

          # Priority: CREDENCIAIS_AI_STORE (FTP/SSH/VNC bundle) first
          merge_json(os.environ.get('CREDS_AI_STORE'), 'CREDENCIAIS_AI_STORE')
          merge_json(os.environ.get('CREDS_PLATAFORMA'), 'CREDENCIAIS_PLATAFORMA_BAIT')
          merge_json(os.environ.get('CREDS_HOSTGATOR'), 'CREDENCIAIS_HOSTGATOR')

          # Explicit host secrets
          add_host(os.environ.get('SSH_HOST_S'), 'SSH_HOST')
          add_host(os.environ.get('HOSTGATOR_SHARED_IP'), 'HOSTGATOR_SHARED_IP')
          add_host(os.environ.get('HOSTGATOR_SERVER'), 'HOSTGATOR_SERVER')
          add_host(os.environ.get('FTP_HOST_S'), 'FTP_HOST')

          if not st['passphrase'] and st['password']:
              st['passphrase'] = st['password']
              st['passphrase_source'] = 'password_as_passphrase'
              print(f'  passphrase_from_password_fallback len={len(st["passphrase"])}')

          if not st['hosts'] or not st['user']:
              print('::error::host/user vazios — set CREDENCIAIS_AI_STORE or SSH_HOST+SSH_USER')
              raise SystemExit(1)

          port = int(st['port'] if st['port'] not in ('21', '990', '989', '') else '22')
          chosen = None
          for h, label in st['hosts']:
              try:
                  socket.setdefaulttimeout(8)
                  infos = socket.getaddrinfo(h, port, socket.AF_INET, socket.SOCK_STREAM)
                  for fam, typ, proto, _, sockaddr in infos:
                      try:
                          s = socket.socket(fam, typ, proto)
                          s.settimeout(8)
                          s.connect(sockaddr)
                          s.close()
                          chosen = (h, label, sockaddr[0])
                          print(f'  tcp_ok {label} → {sockaddr[0]}:{port}')
                          break
                      except Exception as e:
                          print(f'  tcp_fail {label} {sockaddr[0]}:{port} ({type(e).__name__})')
                  if chosen:
                      break
              except Exception as e:
                  print(f'  resolve_fail {label} ({type(e).__name__}: {e})')

          if not chosen:
              h, label = st['hosts'][0]
              chosen = (h, label, h)
              print(f'::warning::no TCP probe success — trying first host {label}')

          host = chosen[0]
          print(f'  chosen_host={chosen[1]} ipv4_hint={chosen[2]}')

          key_path = pathlib.Path.home() / '.ssh_key_resolved'
          key_ok = False
          key_needs_passphrase = False
          key = st['key']
          if key:
              body = key.replace('\\n', '\n')
              if 'BEGIN' not in body:
                  try:
                      decoded = base64.b64decode(re.sub(r'\s+', '', body))
                      if b'BEGIN' in decoded:
                          body = decoded.decode()
                  except Exception:
                      pass
              key_path.write_text(body if body.endswith('\n') else body + '\n')
              key_path.chmod(0o600)
              is_pkcs = 'ENCRYPTED' in body and 'DEK-Info' in body
              is_openssh = bool(re.search(
                  r'-----BEGIN OPENSSH PRIVATE KEY-----\s*\n[^\n]*?(aes|3des|des|bf)[0-9\-]*?(ctr|cbc|cfb|ofb|ecb)',
                  body, re.M))
              key_needs_passphrase = is_pkcs or is_openssh
              if not key_needs_passphrase:
                  # Still try empty passphrase; may detect encrypted via stderr
                  proc0 = subprocess.run(
                      ['ssh-keygen', '-y', '-f', str(key_path), '-P', ''],
                      capture_output=True, text=True, timeout=10,
                  )
                  if proc0.returncode != 0:
                      err = (proc0.stderr or '').lower()
                      if 'passphrase' in err or 'encrypted' in err or 'load failed' in err:
                          key_needs_passphrase = True

              if key_needs_passphrase and st['passphrase']:
                  proc = subprocess.run(
                      ['ssh-keygen', '-y', '-f', str(key_path), '-P', st['passphrase']],
                      capture_output=True, text=True, timeout=10,
                  )
                  key_ok = proc.returncode == 0
                  print(f'  key_unlock_ok={key_ok} source={st["passphrase_source"]}')
                  if not key_ok:
                      print(f'  unlock_stderr={(proc.stderr or "")[:240]}')
              elif not key_needs_passphrase:
                  proc = subprocess.run(
                      ['ssh-keygen', '-y', '-f', str(key_path), '-P', ''],
                      capture_output=True, text=True, timeout=10,
                  )
                  key_ok = proc.returncode == 0
              print(f'  key_ok={key_ok} encrypted={key_needs_passphrase} source={st["passphrase_source"]}')

              if key and key_needs_passphrase and not st['passphrase']:
                  print('::error::chave encrypted sem passphrase — confira SSH_KEY_PASSPHRASE')
                  raise SystemExit(1)

          prefer_ssh = (os.environ.get('PREFER_SSH') or 'true').lower() in ('true', '1', 'yes')
          password = st['password']

          if key_ok and prefer_ssh:
              mode = 'ssh'
              port = str(port)
          elif password:
              mode = 'ftp'
              port = clean(os.environ.get('FTP_PORT_S') or '21') or '21'
              print('::warning::SSH key not usable — FTP fallback')
          else:
              print('::error::Need valid SSH key+passphrase or FTP password')
              raise SystemExit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HG_HOST={host}\nHG_PORT={port}\nHG_USER={st["user"]}\nHG_MODE={mode}\n')
              f.write(f'HG_NEED_AGENT={"1" if (mode == "ssh" and key_needs_passphrase) else "0"}\n')
              f.write(f'HG_HOST_LABEL={chosen[1]}\n')
              if password:
                  pf = pathlib.Path.home() / '.hg_pass'
                  pf.write_text(password); pf.chmod(0o600)
                  f.write(f'HG_PASS_FILE={pf}\n')
              if mode == 'ssh' and key_needs_passphrase and st['passphrase']:
                  ppf = pathlib.Path.home() / '.ssh_passphrase'
                  ppf.write_text(st['passphrase']); ppf.chmod(0o600)
          print(f'  resolved mode={mode} host_label={chosen[1]} port={port} user={st["user"]} passphrase_source={st["passphrase_source"]}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write(f'mode={mode}\n')
              o.write(f'passphrase_source={st["passphrase_source"]}\n')
              o.write(f'host_label={chosen[1]}\n')
              o.write(f'key_ok={"true" if key_ok else "false"}\n')
          PY

      - name: Setup SSH + probe
        if: steps.creds.outputs.mode == 'ssh'
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cp "$HOME/.ssh_key_resolved" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            eval "$(ssh-agent -s)"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
            printf '%s\n' '#!/bin/sh' 'cat $HOME/.ssh_passphrase' > /tmp/askpass.sh
            chmod 700 /tmp/askpass.sh
            DISPLAY= SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force \
              ssh-add "$HOME/.ssh_key_resolved"
            echo "  KEY VALIDATED: ssh-agent loaded (source=${{ steps.creds.outputs.passphrase_source }})"
          fi
          {
            echo "Host deploy-target"
            echo "  HostName $HG_HOST"
            echo "  Port $HG_PORT"
            echo "  User $HG_USER"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  AddressFamily inet"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 25"
            echo "  ConnectionAttempts 3"
            echo "  BatchMode yes"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          : > ~/.ssh/known_hosts
          ssh-keyscan -4 -T 10 -p "$HG_PORT" "$HG_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH probe $HG_USER@$HG_HOST:$HG_PORT label=${HG_HOST_LABEL:-?} agent=${HG_NEED_AGENT:-0}"
          getent ahostsv4 "$HG_HOST" || true
          timeout 5 bash -c "echo >/dev/tcp/$HG_HOST/$HG_PORT" && echo "tcp/$HG_PORT open" || echo "tcp/$HG_PORT closed-or-filtered"
          ssh -4 deploy-target 'echo remote-ok && hostname && whoami && ls -la public_html 2>/dev/null | head -5 || true'

      - name: Upload + restart (SSH)
        if: steps.creds.outputs.mode == 'ssh'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            eval "$(ssh-agent -s)"
            export SSH_AUTH_SOCK SSH_AGENT_PID
            printf '%s\n' '#!/bin/sh' 'cat $HOME/.ssh_passphrase' > /tmp/askpass.sh
            chmod 700 /tmp/askpass.sh
            DISPLAY= SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force \
              ssh-add "$HOME/.ssh_key_resolved"
          fi
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            gzip -c aistore-standalone.tar.gz | ssh -4 deploy-target \
              'gunzip > ~/public_html/aistore-codebase.tar.gz'
          else
            scp -4 -o ConnectTimeout=30 aistore-standalone.tar.gz deploy-target:~/public_html/aistore-codebase.tar.gz
          fi
          if [ -n "${SESSION_SECRET:-}" ] && [ ${#SESSION_SECRET} -ge 16 ]; then
            ssh -4 deploy-target "export SESSION_SECRET=$(printf %q "$SESSION_SECRET"); bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          else
            echo "::warning::SESSION_SECRET missing — remote deploy-manual may still extract"
            ssh -4 deploy-target "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          fi

      - name: Install lftp
        if: steps.creds.outputs.mode == 'ftp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP (fail-fast)
        if: steps.creds.outputs.mode == 'ftp'
        timeout-minutes: 8
        run: |
          set -e
          echo "FTP → $HG_USER@$HG_HOST:$HG_PORT"
          mkdir -p /tmp/aistore-pkg
          for f in hostgator/aistore-api.cgi hostgator/api.cgi hostgator/.htaccess \
                   hostgator/deploy-manual.sh deploy/deploy-on-server.sh; do
            [ -f "$f" ] && cp "$f" "/tmp/aistore-pkg/$(basename "$f")"
          done
          cp aistore-standalone.tar.gz /tmp/aistore-codebase.tar.gz
          python3 - <<'PY'
          import os, pathlib
          host=os.environ['HG_HOST']; port=os.environ['HG_PORT']
          user=os.environ['HG_USER']; password=open(os.environ['HG_PASS_FILE']).read()
          lines=[
            'set ftp:ssl-force true',
            'set ssl:verify-certificate no',
            'set net:timeout 25',
            'set net:max-retries 2',
            'set ftp:passive-mode true',
            f'open -p {port} -u {user},{password} {host}',
            'mkdir -p public_html/aistore',
            'put /tmp/aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz',
          ]
          pkg=pathlib.Path('/tmp/aistore-pkg')
          if (pkg/'aistore-api.cgi').exists():
            lines += ['put /tmp/aistore-pkg/aistore-api.cgi -o public_html/aistore/api.cgi', 'chmod 755 public_html/aistore/api.cgi']
          if (pkg/'deploy-manual.sh').exists():
            lines += ['put /tmp/aistore-pkg/deploy-manual.sh -o public_html/deploy-manual.sh', 'chmod 755 public_html/deploy-manual.sh']
          lines.append('bye')
          pathlib.Path('/tmp/lftp_run.txt').write_text('\n'.join(lines)+'\n')
          PY
          lftp -f /tmp/lftp_run.txt
          echo "[+] FTP upload complete"

      - name: Smoke — API + basePath gate
        id: smoke
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" --max-time 15 \
              "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::api/stats not 200 after publish"
            echo "api_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 -c "import json;s=json.load(open('/tmp/stats.json'));print('OK total',s.get('total'));assert int(s.get('total',0))>0"
          curl -sS --max-time 20 "https://www.mybait.org/aistore/" -o /tmp/home.html
          if grep -q '__BAIT_BASEPATH_PATCHED__' /tmp/home.html; then
            echo "basepath_polyfill=present"
          else
            echo "::warning::HTML without polyfill"
          fi
          echo "api_ok=true" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store" >> $GITHUB_STEP_SUMMARY
          echo "- mode: \`${{ steps.creds.outputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- key_ok: \`${{ steps.creds.outputs.key_ok }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- passphrase_source: \`${{ steps.creds.outputs.passphrase_source }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- host_label: \`${{ steps.creds.outputs.host_label }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- smoke: \`${{ steps.smoke.outputs.api_ok }}\`" >> $GITHUB_STEP_SUMMARY
