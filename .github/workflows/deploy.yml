name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator SSH publish'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20.18.0'
  DATABASE_URL: 'file:./db/custom.db'
  NEXT_PUBLIC_BASE_PATH: '/aistore'
  NEXT_PUBLIC_BASE_URL: 'https://www.mybait.org/aistore'
  SESSION_SECRET: 'ci-build-only-not-for-production-16c'

concurrency:
  group: deploy-aistore
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx vitest run --reporter=verbose 2>&1 | tail -30

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Ensure SQLite DB path for SSG
        run: |
          mkdir -p db
          if [ ! -f db/custom.db ]; then
            echo "::warning::db/custom.db missing — generating empty schema for build"
            npx prisma db push --skip-generate || true
          fi
          ls -la db/ || true
      - run: npx prisma generate
      - run: npm run build
      - name: Package standalone
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
      - name: Hash artefact
        id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            ## AI Store v1.0.0 — Automated Deploy
            **Commit:** ${{ github.sha }}
            **Artifact SHA-256:** ${{ needs.build.outputs.artifact_sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator via SSH
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event.inputs.skip_hostgator != 'true' && (needs.build.result == 'success' || github.event.inputs.skip_tests == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Setup SSH (HostGator)
        shell: bash
        env:
          SSH_HOST_RAW: ${{ secrets.SSH_HOST }}
          SSH_PORT_RAW: ${{ secrets.SSH_PORT }}
          SSH_USER_RAW: ${{ secrets.SSH_USER }}
          SSH_KEY_RAW: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          H=$(printf '%s' "$SSH_HOST_RAW" | tr -d '\r\n\t "'\''' | tr -d ' ')
          P=$(printf '%s' "$SSH_PORT_RAW" | tr -d '\r\n\t "'\''' | tr -d ' ')
          U=$(printf '%s' "$SSH_USER_RAW" | tr -d '\r\n\t "'\''' | tr -d ' ')

          if [ -z "$H" ]; then echo "::error::SSH_HOST vazio"; exit 1; fi
          if [ -z "$U" ]; then echo "::error::SSH_USER vazio"; exit 1; fi
          [ -z "$P" ] && P=22

          KEY_FILE="$HOME/.ssh/id_deploy"
          # Support: (1) PEM multiline  (2) base64 one-line  (3) escaped \n
          RAW=$(printf '%s' "$SSH_KEY_RAW" | tr -d '\r')
          if printf '%s' "$RAW" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$RAW" | sed 's/\\n/\n/g' > "$KEY_FILE"
          else
            # try base64 decode
            if printf '%s' "$RAW" | tr -d '\n ' | base64 -d > "$KEY_FILE" 2>/dev/null \
              && grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
              echo "  SSH key loaded from base64"
            else
              printf '%s\n' "$RAW" | sed 's/\\n/\n/g' > "$KEY_FILE"
            fi
          fi
          # ensure trailing newline
          [ -n "$(tail -c1 "$KEY_FILE")" ] && echo >> "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY invalida ou corrompida"
            echo "::error::Use PEM completo (BEGIN/END) ou base64 -w0 da chave privada"
            exit 1
          fi
          echo "  SSH private key OK ($(ssh-keygen -lf "$KEY_FILE" | awk '{print $2}') )"

          {
            echo "Host deploy-target"
            echo "  HostName $H"
            echo "  Port $P"
            echo "  User $U"
            echo "  IdentityFile $KEY_FILE"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ServerAliveInterval 30"
            echo "  ConnectTimeout 15"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          : > ~/.ssh/known_hosts
          ssh-keyscan -T 8 -p "$P" -H "$H" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err && \
              echo "  known_hosts populado ($(wc -l < ~/.ssh/known_hosts) linhas)" || \
              { echo "::warning::ssh-keyscan best-effort falhou"; cat /tmp/keyscan.err 2>/dev/null | head -3 || true; }
          chmod 644 ~/.ssh/known_hosts

          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 deploy-target 'echo remote-ok && hostname && whoami'; then
            echo "::error::Probe SSH falhou — confira authorized_keys no HostGator e SSH_HOST/USER/PORT"
            exit 1
          fi

          echo "  Setup SSH OK — host=$H port=$P user=$U"

      - name: Upload tarball to HostGator
        run: |
          set -e
          scp aistore-standalone.tar.gz deploy-target:~/public_html/aistore-codebase.tar.gz

      - name: Extract + restart on HostGator
        run: |
          set -e
          ssh deploy-target "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"

      - name: Verify HostGator deploy
        run: |
          set -e
          echo "Aguardando AI Store subir (max 90s)..."
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API up depois de ${i} tentativas"
              break
            fi
            sleep 3
          done
          test "$(curl -sSf -o /dev/null -w '%{http_code}' https://www.mybait.org/aistore/api/stats)" = "200"
          python3 - <<'PY'
          import json,sys
          s=json.load(open('/tmp/stats.json'))
          req=['total','categories','avgPulsarEnergy','totalDownloads','totalExecutions','featuredCount']
          missing=[k for k in req if k not in s]
          if missing:
              print('FAIL missing keys:',missing); sys.exit(1)
          print(f"OK total={s['total']} categorias={len(s['categories'])} downloads={s['totalDownloads']} execucoes={s['totalExecutions']} featured={s['featuredCount']}")
          assert s['total'] > 0, 'AI Store sem produtos'
          assert len(s['categories']) >= 1, 'AI Store sem categorias'
          PY

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- artefato publicado via SSH em HostGator" >> $GITHUB_STEP_SUMMARY
          echo "- /aistore/api/stats validado" >> $GITHUB_STEP_SUMMARY
