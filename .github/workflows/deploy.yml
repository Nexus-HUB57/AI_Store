name: Deploy AI Store to HostGator

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      skip_hostgator:
        description: 'Skip HostGator publish'
        required: false
        default: 'false'
        type: boolean
      prefer_ssh:
        description: 'Force SSH mode when key present (ignore FTP port 21)'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '20.18.0'
  DATABASE_URL: 'file:./db/custom.db'
  NEXT_PUBLIC_BASE_PATH: '/aistore'
  NEXT_PUBLIC_BASE_URL: 'https://www.mybait.org/aistore'
  SESSION_SECRET: 'ci-build-only-not-for-production-16c'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: deploy-aistore-production
  cancel-in-progress: true

jobs:
  validate-secrets:
    name: Validate Secrets & Env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build env
        run: node scripts/validate-ci-env.mjs build
      - name: Validate deploy secrets (presence only)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CREDENCIAIS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
          CREDENCIAIS_PLATAFORMA_BAIT: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
        run: |
          node scripts/validate-ci-env.mjs deploy
          echo "::notice::Prefer SSH (SSH_PRIVATE_KEY + port 22). FTP from GHA often times out on HostGator:21"

  test:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: mkdir -p db && npx prisma generate && npx prisma db push
      - run: npx vitest run --reporter=verbose 2>&1 | tail -40

  build:
    runs-on: ubuntu-latest
    needs: [test, validate-secrets]
    if: always() && needs.validate-secrets.result == 'success' && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    outputs:
      artifact_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Sync Prisma schema (always)
        run: |
          mkdir -p db
          npx prisma db push --skip-generate --accept-data-loss
      - run: npx prisma generate
      - name: Build Next.js (basePath=/aistore)
        run: npm run build
      - name: Package standalone tarball
        run: |
          cd .next/standalone
          tar czf ../../aistore-standalone.tar.gz .
          ls -lh ../../aistore-standalone.tar.gz
      - id: hash
        run: echo "sha=$(sha256sum aistore-standalone.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: aistore-standalone
          path: aistore-standalone.tar.gz
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aistore-v1.0.0-${{ github.run_number }}
          files: aistore-standalone.tar.gz
          body: |
            AI Store production artifact
            Commit: ${{ github.sha }}
            SHA-256: ${{ needs.build.outputs.artifact_sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hostgator:
    name: Publish to HostGator (SSH preferred)
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event.inputs.skip_hostgator != 'true' && needs.build.result == 'success' }}
    timeout-minutes: 25
    environment:
      name: production
      url: https://www.mybait.org/aistore/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aistore-standalone

      - name: Resolve credentials (SSH > FTP)
        id: creds
        env:
          SSH_HOST_S: ${{ secrets.SSH_HOST }}
          SSH_PORT_S: ${{ secrets.SSH_PORT }}
          SSH_USER_S: ${{ secrets.SSH_USER }}
          SSH_KEY_S: ${{ secrets.SSH_PRIVATE_KEY }}
          # Passphrase aliases (in priority order)
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          VPS_HOST_S: ${{ secrets.VPS_HOST }}
          VPS_PORT_S: ${{ secrets.VPS_PORT }}
          VPS_USER_S: ${{ secrets.VPS_USER }}
          VPS_KEY_S: ${{ secrets.VPS_SSH_KEY }}
          CREDS_PLATAFORMA: ${{ secrets.CREDENCIAIS_PLATAFORMA_BAIT }}
          CREDS_HOSTGATOR: ${{ secrets.CREDENCIAIS_HOSTGATOR }}
          PREFER_SSH: ${{ github.event.inputs.prefer_ssh || 'true' }}
        run: |
          set -e
          python3 << 'PY'
          import os, json, re, pathlib, base64, subprocess

          def clean(s):
              if s is None: return ''
              return re.sub(r'[\r\n\t "\']', '', str(s)).strip()

          st = {
              'host': clean(os.environ.get('SSH_HOST_S') or os.environ.get('VPS_HOST_S')),
              'port': clean(os.environ.get('SSH_PORT_S') or os.environ.get('VPS_PORT_S')),
              'user': clean(os.environ.get('SSH_USER_S') or os.environ.get('VPS_USER_S')),
              'key': (os.environ.get('SSH_KEY_S') or os.environ.get('VPS_KEY_S') or '').strip(),
              'passphrase': '',
              'password': '',
          }

          # Pick passphrase from any of the alias secrets
          for envk in ('SSH_KEY_PASSPHRASE', 'SSH_PASSPHRASE', 'KEY_PASSPHRASE', 'PASSPHRASE'):
              v = (os.environ.get(envk) or '').strip()
              if v:
                  st['passphrase'] = v
                  print(f'  passphrase_from_secret={envk} len={len(v)}')
                  break
          else:
              print('  passphrase_from_secret=NONE (all aliases empty)')

          def merge_json(raw, label):
              if not raw or not str(raw).strip():
                  print(f'  {label}: empty'); return
              text = str(raw).strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "'\"":
                  text = text[1:-1]
              try:
                  c = json.loads(text)
              except Exception as e:
                  print(f'  {label}: not JSON ({e})'); return
              if not isinstance(c, dict): return
              print(f'  {label}: keys={sorted(c.keys())}')
              st['host'] = st['host'] or clean(c.get('host') or c.get('ssh_host') or c.get('hostname') or c.get('ip') or c.get('ftp_host'))
              st['user'] = st['user'] or clean(c.get('user') or c.get('ssh_user') or c.get('username') or c.get('ftp_user'))
              # Prefer ssh_port over generic port (generic often is FTP 21)
              p = c.get('ssh_port') or c.get('port') or c.get('ftp_port')
              if p is not None and str(p).strip():
                  st['port'] = clean(str(p))
              k = c.get('private_key') or c.get('ssh_key') or c.get('ssh_private_key') or c.get('key') or ''
              if k and not st['key']:
                  st['key'] = str(k).strip()
              pw = c.get('password') or c.get('pass') or c.get('ftp_pass') or c.get('ftp_password') or ''
              if pw and not st['password']:
                  st['password'] = str(pw)

          merge_json(os.environ.get('CREDS_PLATAFORMA'), 'CREDENCIAIS_PLATAFORMA_BAIT')
          merge_json(os.environ.get('CREDS_HOSTGATOR'), 'CREDENCIAIS_HOSTGATOR')

          host, port, user = st['host'], st['port'], st['user']
          key, password = st['key'], st['password']
          if not host or not user:
              print('::error::host/user vazios — set SSH_HOST+SSH_USER or CREDENCIAIS_*')
              raise SystemExit(1)

          key_path = pathlib.Path.home() / '.ssh_key_resolved'
          key_ok = False
          key_needs_passphrase = False
          if key:
              body = key.replace('\\n', '\n')
              if 'BEGIN' not in body:
                  try:
                      decoded = base64.b64decode(re.sub(r'\s+', '', body))
                      if b'BEGIN' in decoded:
                          body = decoded.decode()
                  except Exception:
                      pass
              key_path.write_text(body if body.endswith('\n') else body + '\n')
              key_path.chmod(0o600)
              # Detecta marker "ENCRYPTED" na chave — significa que precisa passphrase
              key_needs_passphrase = ('ENCRYPTED' in body)
              # Tenta validar com ssh-keygen; se falhar e a chave tem ENCRYPTED,
              # aceita como válida desde que tenhamos o passphrase secret
              if key_needs_passphrase and st['passphrase']:
                  key_ok = True
                  print('  key requires passphrase (will use ssh-agent)')
              else:
                  key_ok = subprocess.call(['ssh-keygen', '-y', '-f', str(key_path)],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) == 0
              print(f'  key_ok={key_ok} bytes={key_path.stat().st_size if key_path.exists() else 0} encrypted={key_needs_passphrase}')

          prefer_ssh = (os.environ.get('PREFER_SSH') or 'true').lower() in ('true', '1', 'yes')

          # SSH wins whenever key parses — never SSH on port 21
          if key_ok and prefer_ssh:
              mode = 'ssh'
              if not port or port in ('21', '990', '989'):
                  port = clean(os.environ.get('SSH_PORT_S') or '22') or '22'
                  if port in ('21', '990', '989'):
                      port = '22'
          elif key_ok:
              mode = 'ssh'
              port = port if port and port not in ('21', '990', '989') else '22'
          elif password:
              mode = 'ftp'
              port = port if port in ('21', '990', '989') else '21'
              print('::warning::No valid SSH key — FTP fallback (may timeout from GHA)')
          else:
              print('::error::Need SSH_PRIVATE_KEY (PEM) or FTP password in CREDENCIAIS_*')
              raise SystemExit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'HG_HOST={host}\nHG_PORT={port}\nHG_USER={user}\nHG_MODE={mode}\n')
              f.write(f'HG_NEED_AGENT={"1" if (mode == "ssh" and key_needs_passphrase) else "0"}\n')
              if password:
                  pf = pathlib.Path.home() / '.hg_pass'
                  pf.write_text(password); pf.chmod(0o600)
                  f.write(f'HG_PASS_FILE={pf}\n')
              if mode == 'ssh' and key_needs_passphrase and st['passphrase']:
                  ppf = pathlib.Path.home() / '.ssh_passphrase'
                  ppf.write_text(st['passphrase']); ppf.chmod(0o600)
          print(f'  resolved mode={mode} host={host} port={port} user={user}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write(f'mode={mode}\n')
          PY

      - name: Setup SSH + probe
        if: steps.creds.outputs.mode == 'ssh'
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cp "$HOME/.ssh_key_resolved" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Se a chave precisa de passphrase, carrega via ssh-agent com SSH_ASKPASS
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            eval "$(ssh-agent -s)"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
            printf '%s\n' '#!/bin/sh' 'cat $HOME/.ssh_passphrase' > /tmp/askpass.sh
            chmod 700 /tmp/askpass.sh
            DISPLAY= SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force \
              ssh-add "$HOME/.ssh_key_resolved"
            echo "  ssh-agent loaded encrypted key"
          fi
          {
            echo "Host deploy-target"
            echo "  HostName $HG_HOST"
            echo "  Port $HG_PORT"
            echo "  User $HG_USER"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ConnectTimeout 20"
            echo "  BatchMode yes"
            echo "  LogLevel ERROR"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 8 -p "$HG_PORT" -H "$HG_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH probe $HG_USER@$HG_HOST:$HG_PORT agent=${HG_NEED_AGENT:-0}"
          ssh deploy-target 'echo remote-ok && hostname && whoami && ls -la public_html 2>/dev/null | head -5 || true'

      - name: Upload + restart (SSH)
        if: steps.creds.outputs.mode == 'ssh'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            eval "$(ssh-agent -s)"
            SSH_AUTH_SOCK=$SSH_AUTH_SOCK SSH_AGENT_PID=$SSH_AGENT_PID
            export SSH_AUTH_SOCK SSH_AGENT_PID
            printf '%s\n' '#!/bin/sh' 'cat $HOME/.ssh_passphrase' > /tmp/askpass.sh
            chmod 700 /tmp/askpass.sh
            DISPLAY= SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force \
              ssh-add "$HOME/.ssh_key_resolved"
          fi
          if [ "${HG_NEED_AGENT:-0}" = "1" ]; then
            # scp não suporta ssh-agent forward sem mais setup — usa cat+ssh
            gzip -c aistore-standalone.tar.gz | ssh deploy-target \
              'gunzip > ~/public_html/aistore-codebase.tar.gz'
          else
            scp -o ConnectTimeout=30 aistore-standalone.tar.gz deploy-target:~/public_html/aistore-codebase.tar.gz
          fi
          if [ -n "${SESSION_SECRET:-}" ] && [ ${#SESSION_SECRET} -ge 16 ]; then
            ssh deploy-target "export SESSION_SECRET=$(printf %q "$SESSION_SECRET"); bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          else
            echo "::warning::SESSION_SECRET missing on GHA — remote deploy-manual may still extract"
            ssh deploy-target "bash ~/aistore-api/deploy-manual.sh || bash ~/public_html/deploy-manual.sh"
          fi

      - name: Install lftp
        if: steps.creds.outputs.mode == 'ftp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP (fail-fast)
        if: steps.creds.outputs.mode == 'ftp'
        timeout-minutes: 8
        run: |
          set -e
          echo "FTP → $HG_USER@$HG_HOST:$HG_PORT (fail-fast timeouts)"
          mkdir -p /tmp/aistore-pkg
          for f in hostgator/aistore-api.cgi hostgator/api.cgi hostgator/.htaccess \
                   hostgator/deploy-manual.sh deploy/deploy-on-server.sh; do
            [ -f "$f" ] && cp "$f" "/tmp/aistore-pkg/$(basename "$f")"
          done
          cp aistore-standalone.tar.gz /tmp/aistore-codebase.tar.gz
          python3 - <<'PY'
          import os, pathlib
          host=os.environ['HG_HOST']; port=os.environ['HG_PORT']
          user=os.environ['HG_USER']; password=open(os.environ['HG_PASS_FILE']).read()
          lines=[
            'set ftp:ssl-force true',
            'set ssl:verify-certificate no',
            'set net:timeout 25',
            'set net:max-retries 2',
            'set ftp:passive-mode true',
            f'open -p {port} -u {user},{password} {host}',
            'mkdir -p public_html/aistore',
            'put /tmp/aistore-codebase.tar.gz -o public_html/aistore-codebase.tar.gz',
          ]
          pkg=pathlib.Path('/tmp/aistore-pkg')
          if (pkg/'aistore-api.cgi').exists():
            lines += ['put /tmp/aistore-pkg/aistore-api.cgi -o public_html/aistore/api.cgi', 'chmod 755 public_html/aistore/api.cgi']
          if (pkg/'deploy-manual.sh').exists():
            lines += ['put /tmp/aistore-pkg/deploy-manual.sh -o public_html/deploy-manual.sh', 'chmod 755 public_html/deploy-manual.sh']
          lines.append('bye')
          pathlib.Path('/tmp/lftp_run.txt').write_text('\n'.join(lines)+'\n')
          PY
          lftp -f /tmp/lftp_run.txt
          echo "[+] FTP upload complete"

      - name: Smoke — API + basePath gate
        id: smoke
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stats.json -w "%{http_code}" --max-time 15 \
              "https://www.mybait.org/aistore/api/stats" || echo "000")
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::api/stats not 200 after publish"
            echo "api_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 -c "import json;s=json.load(open('/tmp/stats.json'));print('OK total',s.get('total'));assert int(s.get('total',0))>0"
          products_code=$(curl -sS -o /tmp/products.json -w "%{http_code}" --max-time 20 \
            "https://www.mybait.org/aistore/api/products?page=1&limit=1&sort=pulsar")
          if [ "$products_code" != "200" ]; then
            echo "::error::api/products returned HTTP $products_code after publish"
            exit 1
          fi
          python3 -c "import json;p=json.load(open('/tmp/products.json'));items=p.get('products',[]);print('OK products',len(items),'total',p.get('pagination',{}).get('total'));assert len(items)>0 and int(p.get('pagination',{}).get('total',0))>0"
          curl -sS --max-time 20 "https://www.mybait.org/aistore/" -o /tmp/home.html
          if grep -q 'Erro Inesperado' /tmp/home.html; then
            echo "::error::homepage contains generic error boundary"
            exit 1
          fi
          if grep -q '__BAIT_BASEPATH_PATCHED__' /tmp/home.html; then
            echo "basepath_polyfill=present"
          else
            echo "::warning::HTML without polyfill — may need hard refresh or extract incomplete"
          fi
          echo "api_ok=true" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          echo "### Deploy AI Store" >> $GITHUB_STEP_SUMMARY
          echo "- mode: \`${{ steps.creds.outputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- smoke: \`${{ steps.smoke.outputs.api_ok }}\`" >> $GITHUB_STEP_SUMMARY
