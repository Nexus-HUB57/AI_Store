# AI Store Nexus AI-OS — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Default: SQLite (zero external dependencies)
# PostgreSQL: docker compose -f docker-compose.prod.yml --profile postgres up -d

services:
  ai-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-store-nexus
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3443}:3443"
    volumes:
      - store-db:/app/db
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/db/custom.db}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://ai-store.nexus-os.io}
      - BAIT_PER_SAT=100
      - SIGNUP_BONUS_BAIT=100
      - REFERRAL_BONUS_BAIT=25
      - PULSAR_INTERVAL_MS=3000
      - LOG_LEVEL=info
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional PostgreSQL (activate with --profile postgres) ──
  postgres:
    image: postgres:16-alpine
    container_name: ai-store-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aistore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aistore_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai_store}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aistore} -d ${POSTGRES_DB:-ai_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  store-db:
    driver: local
  pgdata:
    driver: local
